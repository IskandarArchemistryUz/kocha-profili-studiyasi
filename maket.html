*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14.5px/1.45 Archivo,system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}

.seg{display:flex;border:1px solid var(--line2);border-radius:2px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:0 9px;height:28px;font-family:var(--mono);font-size:13px}.seg button[aria-pressed=true]{background:var(--ink);color:#f4f3f1}

.btn.dark{background:var(--ink);color:var(--bg)}.btn.sm{height:26px;padding:0 9px;font-size:12px}.btn.ghost{border-color:var(--line2)}
.ib{width:30px;height:30px;border:1px solid transparent;background:none;border-radius:2px;display:grid;place-items:center}.ib:hover{border-color:var(--line2)}
.menu{position:absolute;right:14px;top:48px;background:#fff;border:1px solid var(--line2);box-shadow:0 6px 24px rgba(0,0,0,.12);z-index:50;min-width:220px;padding:6px}

.pg{display:flex;gap:8px;align-items:flex-start;cursor:pointer}.pg .th{flex:none;background:#fff;border:1px solid var(--line2);overflow:hidden}.pg.on .th{outline:2px solid var(--ink)}

.stage{user-select:none;-webkit-user-select:none;position:relative;background:var(--desk);overflow:auto;min-width:0}
.tools{position:sticky;top:10px;left:0;margin:10px auto 0;width:max-content;z-index:20;display:flex;gap:2px;padding:4px;background:#fff;border-radius:2px;box-shadow:0 2px 10px rgba(0,0,0,.08)}

.tools .dv{width:1px;background:var(--line);margin:4px}
.tools svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#paper{user-select:none;-webkit-user-select:none;display:block;margin:18px auto 80px;box-shadow:0 6px 30px rgba(0,0,0,.14);background:#fff;touch-action:none}

.f{display:grid;grid-template-columns:1fr 1fr;gap:6px}.f label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--grey)}

.r .full{grid-column:1/-1}.sw{display:flex;gap:5px;flex-wrap:wrap}.sw button{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2)}.sw button.on{box-shadow:0 0 0 2px #fff,0 0 0 3px var(--ink)}

#ed{position:absolute;z-index:30;border:1px dashed var(--sel);background:rgba(255,255,255,.95);resize:none;outline:none;padding:0;line-height:1.25;overflow:hidden}
.modal{position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:100;display:flex;align-items:center;justify-content:center}
.mbox{background:#fff;width:min(1000px,94vw);height:min(720px,90vh);display:flex;flex-direction:column}

#pres{position:fixed;inset:0;background:#111;z-index:200;display:flex;align-items:center;justify-content:center}#pres svg{max-width:100vw;max-height:100vh;background:#fff}

.toast{background:var(--ink);color:#f4f3f1;padding:10px 14px;font-size:14px;border-radius:2px;max-width:560px}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:300}
.busy{position:fixed;inset:0;background:rgba(244,243,241,.7);z-index:250;display:flex;align-items:center;justify-content:center;font-size:15px}
#ctx{position:fixed;z-index:1000;min-width:230px;background:#fff;border:1px solid var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px 0;font:14px Archivo,sans-serif}

.tools{top:24px!important;margin-top:24px!important}.zoom{left:24px!important}

  if(f==='base'){const sh=p.items.filter(it=>['rect','ellipse','poly'].includes(it.t)&&it.fill&&it.fill!=='none').sort((a,b)=>{const p1=bbox(a),q=bbox(b);return q.w*q.h-p1.w*p1.h;});sh.slice(0,Math.max(1,Math.floor(sh.length/3))).forEach(it=>{it.fill='#dfe3e2';it.role='ctx';});}
  commit();renderAll();}
function auditDlg(onGo){const res=doc.pages.map((p,i)=>({p,i,R:auditPage(p)}));const bad=res.reduce((s,x)=>s+x.R.filter(r=>!r.ok).length,0);
  const ov=document.createElement('div');ov.className='aud';ov.innerHTML=`<div class="audb"><div style="display:flex;align-items:center;gap:10px"><b style="font-size:17px;font-weight:500">Eksportdan oldin tekshiruv</b><span class="note">${bad?bad+' ta ogohlantirish':'hammasi joyida'}</span><span style="flex:1"></span><button class="btn sm ghost" data-a="x">Yopish</button></div>
    <div class="note" style="margin:4px 0 10px">7 band: rang vazifasi, jim asos, toifalar farqi, legenda, kulrang rejim, qizil rang, bitta asosiy xabar. Avtomatik baho — yakuniy qaror sizda.</div>
    ${res.map(({i,R})=>`<div class="lbl" style="margin-top:8px">Varaq ${i+1}</div>${R.map(r=>`<div class="audr"><span class="ai ${r.ok?'ok':'w'}">${r.ok?'✓':'!'}</span><div><div>${esc(r.t)}</div><div class="note">${esc(r.d)}</div></div>${!r.ok&&r.fix?`<button class="btn sm ghost" data-fx="${i}:${r.k}">Tuzatish</button>`:''}</div>`).join('')}`).join('')}
    <div class="row" style="margin-top:12px;justify-content:flex-end">${onGo?`<button class="btn dark" data-a="go">${bad?'Baribir yuklab olish':'Yuklab olish'}</button>`:''}</div></div>`;document.body.appendChild(ov);
  ov.onclick=e=>{const b=e.target.closest('button');if(!b){if(e.target===ov)ov.remove();return;}if(b.dataset.a==='x'){ov.remove();return;}if(b.dataset.a==='go'){ov.remove();onGo();return;}
    if(b.dataset.fx){const [pi,k]=b.dataset.fx.split(':'),p=doc.pages[+pi],r=auditPage(p).find(x=>x.k===k);auditFix(p,r.fix,r);ov.remove();auditDlg(onGo);}};}
function renderAll(){try{syncLegends();}catch(e){}renderHead();renderPaper();renderLeft();renderProps();}
window.addEventListener('focus',async()=>{await loadMats();if(lt==='mat')renderLeft();});
window.addEventListener('resize',()=>renderPaper());
/* ---------- ishga tushirish ---------- */
(async()=>{renderTools();try{const d=(await getAll('kps_maket','docs')).find(x=>x.id==='main');if(d&&d.pages&&d.pages.length)doc=d;}catch(e){}
  await loadMats();const q=new URLSearchParams(location.search);if(q.get('add')){const m=MATS.find(x=>x.id===q.get('add'));if(m){const [W,Hh]=pageWH(pg());addMat(m,W/2,Hh/2);}history.replaceState(null,'',location.pathname);}
  migrate();H.a=[JSON.stringify(doc)];H.i=0;renderAll();fitZoom();
  doc.pages.forEach(p=>p.items.forEach(it=>{if(it.t==='map'&&!it.src&&it.lat!=null)refreshMap(it);}));})();
window.KPS_MK={get doc(){return doc;},pageCanvas};
})();
