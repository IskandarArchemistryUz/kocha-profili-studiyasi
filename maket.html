<style>
:root{--ink:#141414;--grey:#696969;--txt:#3c3c3c;--bg:#f4f3f1;--desk:#e7e6e2;--line:#dedcd7;--line2:#cfccc5;--sel:#2f6feb;--bad:#b3261e;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:13px/1.45 Archivo,system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
header{height:52px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px}.brand b{font-weight:500;font-size:13px;letter-spacing:.2em}
.crumb{font-size:11px;letter-spacing:.14em;color:var(--grey)}.sp{flex:1}
#docName{border:1px solid transparent;background:transparent;font-size:14px;font-weight:500;padding:4px 6px;width:240px;border-radius:2px}#docName:hover,#docName:focus{border-color:var(--line2);background:#fff}
.seg{display:flex;border:1px solid var(--line2);border-radius:2px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:0 9px;height:28px;font-family:var(--mono);font-size:11.5px}.seg button[aria-pressed=true]{background:var(--ink);color:#f4f3f1}
.btn{height:30px;padding:0 12px;border:1px solid var(--ink);background:transparent;border-radius:2px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.dark{background:var(--ink);color:var(--bg)}.btn.sm{height:26px;padding:0 9px;font-size:10.5px}.btn.ghost{border-color:var(--line2)}
.ib{width:30px;height:30px;border:1px solid transparent;background:none;border-radius:2px;display:grid;place-items:center}.ib:hover{border-color:var(--line2)}
.menu{position:absolute;right:14px;top:48px;background:#fff;border:1px solid var(--line2);box-shadow:0 6px 24px rgba(0,0,0,.12);z-index:50;min-width:220px;padding:6px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;font-size:12.5px}.menu button:hover{background:var(--bg)}.menu small{color:var(--grey);font-family:var(--mono);font-size:10.5px}
main{flex:1;display:grid;grid-template-columns:250px 1fr 270px;min-height:0}
aside{background:#fff;display:flex;flex-direction:column;min-height:0}
aside.l{border-right:1px solid var(--line)}aside.r{border-left:1px solid var(--line);overflow:auto}
.tabs{display:flex;gap:16px;padding:0 14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;height:38px;padding:0;font-size:12.5px;color:var(--grey);border-bottom:2px solid transparent}.tabs button[aria-selected=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.pane{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:10px;letter-spacing:.14em;color:var(--grey);text-transform:uppercase}
.mat{display:flex;gap:10px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:2px;cursor:grab;background:#fff}
.mat:hover{border-color:var(--ink)}.mat .th{width:56px;height:40px;background:#f7f6f3 center/contain no-repeat;flex:none;border:1px solid #efede9}
.mat .n{font-size:12px;line-height:1.3}.mat .m{font-family:var(--mono);font-size:10px;color:var(--grey)}
.note{font-family:var(--mono);font-size:11px;color:var(--grey);line-height:1.55}
.pg{display:flex;gap:8px;align-items:flex-start;cursor:pointer}.pg .th{flex:none;background:#fff;border:1px solid var(--line2);overflow:hidden}.pg.on .th{outline:2px solid var(--ink)}
.pg .n{font-family:var(--mono);font-size:10.5px;color:var(--grey)}.pg .a{display:flex;flex-direction:column;gap:2px;margin-left:auto}.pg .a button{border:0;background:none;font-size:11px;padding:1px 4px;color:var(--grey)}.pg .a button:hover{color:var(--ink)}
.stage{position:relative;background:var(--desk);overflow:auto;min-width:0}
.tools{position:sticky;top:10px;left:0;margin:10px auto 0;width:max-content;z-index:20;display:flex;gap:2px;padding:4px;background:#fff;border-radius:2px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.tools button{width:34px;height:34px;border:0;background:none;border-radius:2px;display:grid;place-items:center}.tools button:hover{background:var(--bg)}.tools button[aria-pressed=true]{background:var(--ink);color:#fff}
.tools .dv{width:1px;background:var(--line);margin:4px}
.tools svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#paper{display:block;margin:18px auto 80px;box-shadow:0 6px 30px rgba(0,0,0,.14);background:#fff;touch-action:none}
.zoom{position:sticky;left:12px;bottom:12px;float:left;margin-top:-50px;z-index:20;display:flex;gap:4px;align-items:center;background:#fff;padding:4px 8px;border-radius:2px;font-family:var(--mono);font-size:11px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.zoom button{border:0;background:none;width:22px;height:22px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:6px}.f label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--grey)}
.f input,.f select,.r select,.r input[type=text],.r input[type=number],.r textarea{border:1px solid var(--line2);border-radius:2px;padding:4px 6px;background:#fff;font-size:12px;width:100%}
.r .full{grid-column:1/-1}.sw{display:flex;gap:5px;flex-wrap:wrap}.sw button{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2)}.sw button.on{box-shadow:0 0 0 2px #fff,0 0 0 3px var(--ink)}
.row{display:flex;gap:6px;flex-wrap:wrap}
#ed{position:absolute;z-index:30;border:1px dashed var(--sel);background:rgba(255,255,255,.95);resize:none;outline:none;padding:0;line-height:1.25;overflow:hidden}
.modal{position:fixed;inset:0;background:rgba(20,20,20,.45);z-index:100;display:flex;align-items:center;justify-content:center}
.mbox{background:#fff;width:min(1000px,94vw);height:min(720px,90vh);display:flex;flex-direction:column}
.mbox header{height:48px}.mbox #pmap{flex:1}.frame{position:absolute;z-index:500;border:2px solid var(--ink);box-shadow:0 0 0 9999px rgba(244,243,241,.45);pointer-events:none;left:50%;top:50%;transform:translate(-50%,-50%)}
#pres{position:fixed;inset:0;background:#111;z-index:200;display:flex;align-items:center;justify-content:center}#pres svg{max-width:100vw;max-height:100vh;background:#fff}
#pres .pi{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:#aaa;font-family:var(--mono);font-size:12px}
.toast{background:var(--ink);color:#f4f3f1;padding:10px 14px;font-size:12.5px;border-radius:2px;max-width:560px}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:300}
.busy{position:fixed;inset:0;background:rgba(244,243,241,.7);z-index:250;display:flex;align-items:center;justify-content:center;font-size:14px}
</style>
</head>

      for(let i=0;i<doc.pages.length;i++){busy(`PPTX: slayd ${i+1} / ${doc.pages.length}`);const p=doc.pages[i],[W,Hh]=pageWH(p),cv=await pageCanvas(p,Math.min(dpi,200)),s=pp.addSlide();const sc=Math.min(W0/W,H0/Hh),w=W*sc/25.4,h=Hh*sc/25.4;s.addImage({data:cv.toDataURL('image/jpeg',.92),x:(W0/25.4-w)/2,y:(H0/25.4-h)/2,w,h});}
      await pp.writeFile({fileName:fn+'.pptx'});}
  }catch(e){toast('Eksport xatosi: '+e.message);}busy();}
$('#expBtn').onclick=e=>{e.stopPropagation();$('#expMenu').hidden=!$('#expMenu').hidden;};document.addEventListener('click',e=>{if(!e.target.closest('#expMenu,#expBtn'))$('#expMenu').hidden=true;});
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>exportAs(b.dataset.x));
$('#openJson').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(!d.pages)throw 0;doc=d;doc.id='main';cur=0;sel=null;commit();renderAll();fitZoom();toast('Albom ochildi.');}).catch(()=>toast('Fayl albom emas.'));e.target.value='';};
/* ---------- taqdimot ---------- */
function present(){let i=cur;const ov=document.createElement('div');ov.id='pres';document.body.appendChild(ov);
  const show=()=>{const p=doc.pages[i],[W,Hh]=pageWH(p);ov.innerHTML=`<svg viewBox="0 0 ${W} ${Hh}" style="width:min(100vw,${W/Hh*100}vh);height:auto">${pageSVG(p,true)}</svg><div class="pi">${i+1} / ${doc.pages.length} · Esc — chiqish</div>`;};
  const key=e=>{if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){i=Math.min(doc.pages.length-1,i+1);show();}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){i=Math.max(0,i-1);show();}else if(e.key==='Escape'){close();}e.stopPropagation();e.preventDefault();};
  const close=()=>{document.removeEventListener('keydown',key,true);ov.remove();if(document.fullscreenElement)document.exitFullscreen();};
  ov.onclick=e=>{i=e.clientX>innerWidth/2?Math.min(doc.pages.length-1,i+1):Math.max(0,i-1);show();};
  document.addEventListener('keydown',key,true);show();if(ov.requestFullscreen)ov.requestFullscreen().catch(()=>{});
  document.addEventListener('fullscreenchange',function f(){if(!document.fullscreenElement&&ov.isConnected){close();}document.removeEventListener('fullscreenchange',f);},{once:false});}
$('#presBtn').onclick=present;
window.__kpsTest={pageCanvas,pg:()=>pg()};
/* ---------- sarlavha boshqaruvi ---------- */
function renderHead(){const p=pg();$('#fmtSeg').innerHTML=Object.keys(FMT).map(k=>`<button data-f="${k}" aria-pressed="${p.fmt===k}">${k}</button>`).join('')+`<button data-f="custom" aria-pressed="${p.fmt==='custom'}" title="Ixtiyoriy oʻlcham">mm</button>`;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{p.fmt=b.dataset.f;commit();renderAll();fitZoom();});
  document.querySelectorAll('[data-o]').forEach(b=>{b.setAttribute('aria-pressed',p.orient===b.dataset.o);b.onclick=()=>{p.orient=b.dataset.o;commit();renderAll();fitZoom();};});
  $('#docName').value=doc.name;}
$('#docName').onchange=e=>{doc.name=e.target.value.trim()||'Albom';commit();renderAll();};
document.querySelectorAll('[data-lt]').forEach(b=>b.onclick=()=>{lt=b.dataset.lt;renderLeft();});
$('#undo').onclick=undo;$('#redo').onclick=redo;
function renderAll(){renderHead();renderPaper();renderLeft();renderProps();}
window.addEventListener('focus',async()=>{await loadMats();if(lt==='mat')renderLeft();});
window.addEventListener('resize',()=>renderPaper());
/* ---------- ishga tushirish ---------- */
(async()=>{renderTools();try{const d=(await getAll('kps_maket','docs')).find(x=>x.id==='main');if(d&&d.pages&&d.pages.length)doc=d;}catch(e){}
  await loadMats();const q=new URLSearchParams(location.search);if(q.get('add')){const m=MATS.find(x=>x.id===q.get('add'));if(m){const [W,Hh]=pageWH(pg());addMat(m,W/2,Hh/2);}history.replaceState(null,'',location.pathname);}
  H.a=[JSON.stringify(doc)];H.i=0;renderAll();fitZoom();
  doc.pages.forEach(p=>p.items.forEach(it=>{if(it.t==='map'&&!it.src&&it.lat!=null)refreshMap(it);}));})();
})();
</script>
