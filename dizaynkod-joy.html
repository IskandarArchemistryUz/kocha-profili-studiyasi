      else if(l0||l1){n=2*(l0||l1);src=`OSM «lanes»: bir tomoni ${l0||l1}, ikkinchisi xuddi shunday deb olindi`;conf='past';}
      c.dual=true;
    }else if(l0){n=l0;src=`OSM «lanes» = ${l0}, bir tomonlama koʻcha`;conf='orta';}
  }else{const l=lanesOf(w0);if(l){n=l;src=`OSM «lanes» = ${l}`;conf='orta';}}
  if(n==null){const wd=parseFloat(t0.width);if(wd>0){n=Math.round(wd/3.5)*(c.dual?2:1);src=`OSM «width» = ${wd} m ÷ 3,5 m`;conf='past';}}
  let grp=null;
  if(n!=null)grp=n>=5?'5-8':'2-4';
  else{const hw=t0.highway;
    if(hw==='trunk'){grp='5-8';src='Yoʻl toifasi «trunk» (magistral)';}
    else if(hw==='primary'){grp=c.dual?'5-8':'2-4';src=c.dual?'«primary», ikki alohida qatnov qismi':'«primary», bitta qatnov qismi';}
    else if(hw==='secondary'){grp=c.dual?'5-8':'2-4';src='«secondary»'+(c.dual?', ikki alohida qatnov qismi':'');}
    else{grp='2-4';src='Yoʻl toifasi: '+(HWRU[hw]||hw);}
    conf='past';}
  if(n!=null&&(n<2||n>8))notes.push(`${n} tasma — hujjatda 2–4 yoki 5–8 berilgan; eng yaqin guruh olindi (talqin)`);
  return {n,grp,src,conf,notes};
}

function choose(i){
  S.pick=i;const c=S.cands[i];S.area=null;
  if(hl){map.removeLayer(hl);hl=null;}
  if(c.kind==='street'||c.kind==='ped'){hl=L.featureGroup(c.ways.map(w=>L.polyline(w.geometry.map(p=>[p.lat,p.lon]),{color:'#e0457b',weight:6,opacity:.85}))).addTo(map);}
  if(c.kind==='street'){S.est=laneEstimate(c);S.lanes=S.est.grp;}else{S.est=null;S.lanes=null;}
  if(c.kind==='inner')S.area=guessInner();
  render();
}

function guessInner(){
  const t=S.areas.map(a=>a.tags||{});
  const has=f=>t.find(f);
  if(has(x=>/^(park|garden)$/.test(x.leisure)))return {tip:(has(x=>/skver|сквер/i.test(x.name||''))?'P5':'P1'),why:'OSM: '+(has(x=>/^(park|garden)$/.test(x.leisure)).name||'park')+' ichida'};
  if(has(x=>x.amenity==='marketplace'))return {tip:'O2',why:'OSM: '+(has(x=>x.amenity==='marketplace').name||'bozor')+' hududida'};
  if(has(x=>x.shop==='mall'))return {tip:'O4',why:'OSM: '+(has(x=>x.shop==='mall').name||'savdo markazi')+' hududida'};
  if(has(x=>/^(theatre|cinema|arts_centre|library|community_centre)$/.test(x.amenity)||x.tourism==='museum'))return {tip:'O3',why:'OSM: madaniy obyekt hududida'};
  if(has(x=>x.leisure==='stadium'||x.tourism==='attraction'||x.historic))return {tip:'O1',why:'OSM: diqqatga sazovor obyekt hududida'};
  const LV=S.levels.slice().sort((a,b)=>a-b);
  if(LV.length>=3){const med=LV[Math.floor(LV.length/2)],lo=LV.filter(x=>x<=3).length,hi=LV.filter(x=>x>=6).length;
    let tip=med<=3?'M1':med<=5?'M3':'M5';if(lo>=2&&hi>=2)tip='M4';
    return {tip,why:`Atrofdagi ${LV.length} ta binoning qavatliligi (OSM): oʻrtacha ${med} qavat`};}
  return {tip:'M3',why:'OSMda atrof haqida maʼlumot kam — oʻzingiz tanlang'};
}

function result(){
  const c=S.cands[S.pick];if(!c)return null;const why=[];let tip;
  if(c.kind==='ped'){tip='U5';why.push(['',`«${c.name}» OSMda piyodalar koʻchasi (highway=pedestrian)`,'1-ilova, 1.3, 10-bet']);why.push(['t','Rasmiy piyoda koʻchalari roʻyxati hali olinmagan — OSM boʻyicha taxmin','']);}
  else if(c.kind==='square'){tip='U6';why.push(['',`Doʻkon «${c.name}» maydoniga qaragan (siz tanladingiz)`,'1-ilova, 1.3, 10-bet']);why.push(['t','Maydonlar roʻyxati OSMdan — rasmiy emas','']);}
  else if(c.kind==='tpu'){tip='U7';why.push(['',`Doʻkon ${c.name} oldidagi transport uzeliga qaragan (siz tanladingiz)`,'1-ilova, 1.3, 10-bet; 1.4, 5-band, 12-bet']);why.push(['t','TPU chegarasi OSMda yoʻq — bekat yaqinligi boʻyicha taxmin','']);}
  else if(c.kind==='street'){
    const nameRing=/kichik\s*halqa|малая\s*кольцев|кичик\s*халқа/i.test(c.name);
    const inside=nameRing||(KH?inPoly(S.pt[1],S.pt[0],KH):false);
    const big=S.lanes==='5-8';tip=inside?(big?'U2':'U1'):(big?'U4':'U3');
    why.push(['',inside?(nameRing?'Doʻkon Kichik halqa yoʻlining oʻziga qaragan — ichkarida deb olinadi':'Kichik halqa yoʻli ichida'):'Kichik halqa yoʻli tashqarisida',KH?'Chiziq: OSM, 2026-10-04 (taxmin)':'']);
    why.push([S.userLanes?'':'t',`Qatnov qismi: ${S.lanes==='5-8'?'5–8':'2–4'} tasma`+(S.userLanes?' (siz tasdiqladingiz)':' — taxmin: '+S.est.src),'']);
    S.est.notes.forEach(n=>why.push(['t',n,'']));
    why.push(['i','Fasad koʻchaga qaraganda koʻcha talablari ustun (U > P > O > M)','1-ilova, 1.4 (12-bet), 1.5 (14-bet)']);
  }else{tip=S.areaTip||(S.area&&S.area.tip)||'M3';why.push([S.areaTip?'':'t',S.areaTip?'Siz tanladingiz':S.area.why,'']);
    why.push(['i','Hovli, park yoki obyekt ichiga qaragan fasad uchun koʻcha tipi qoʻllanmaydi','1-ilova, 1.5, 14–15-bet']);}
  // 3-ilova
  const a3=ANX3.map(a=>[a,haversine(S.pt[0],S.pt[1],a[2],a[3])]).sort((x,y)=>x[1]-y[1])[0];
  if(a3&&a3[1]<450)why.push(['i',`3-ilova roʻyxatidagi gastronomik koʻcha yaqinida: ${a3[0][1]} (${a3[0][0]}), ${Math.round(a3[1])} m. Chegarasi berilmagan — yigʻim stavkasiga taʼsir qiladi (TGKM-${a3[0][4]})`,'3-ilova, 220–221-bet']);
  return {tip,why};
}

function laneSvg(n){const w=92,h=34,lw=Math.min(11,(w-12)/n);let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><rect x="0" y="4" width="${w}" height="26" fill="#ecebe7"/>`;const x0=(w-lw*n)/2;
  for(let i=0;i<n;i++){s+=`<rect x="${x0+i*lw+0.5}" y="6" width="${lw-1}" height="22" fill="#9a9893"/>`;}
  s+=`<line x1="${w/2}" y1="6" x2="${w/2}" y2="28" stroke="#E7A750" stroke-width="1.5"/></svg>`;return s;}

function render(){
  const side=$('#side');let h=`<div class="ah"><h1>Joyingiz tipi</h1><p>Dizayn-kod talablari doʻkon qaysi turdagi jamoat joyida turganiga bogʻliq. Xaritada doʻkon kirishini bosing — tipni OpenStreetMap boʻyicha aniqlaymiz, siz tasdiqlaysiz.</p></div>
  <div class="blk"><h3>1 · Joyni toping</h3><form class="srch" id="sf"><input id="q" placeholder="Manzil yoki koʻcha nomi" autocomplete="off"><button class="btn dark">Topish</button></form>
  <div class="hint">${S.pt?'Joy belgilandi. Boshqa joyni bosib oʻzgartirishingiz mumkin.':'Keyin xaritada doʻkoningiz kirish eshigi turgan joyni bosing.'}</div></div>`;
  if(S.busy)h+=`<div class="blk"><div class="busy"><span class="spin"></span>Atrofdagi koʻchalar yuklanmoqda…</div></div>`;
  if(S.err)h+=`<div class="blk"><div class="err">${esc(S.err)}</div></div>`;
  if(!S.busy&&S.cands.length){
    h+=`<div class="blk"><h3>2 · Kirish eshigi qaysi tomonga qaragan?</h3>`;
    S.cands.forEach((c,i)=>{const sub=c.kind==='street'?(HWRU[c.hw]||c.hw)+' · '+Math.round(c.d)+' m':c.kind==='ped'?'piyodalar koʻchasi · '+Math.round(c.d)+' m':c.kind==='square'?'maydon · '+Math.round(c.d)+' m':c.kind==='tpu'?'transport uzeli · '+Math.round(c.d)+' m':'mahalla, park yoki obyekt hududi';
      h+=`<label class="opt ${S.pick===i?'on':''}"><input type="radio" name="c" value="${i}" ${S.pick===i?'checked':''}><span><b>${esc(c.name)}</b><small>${esc(sub)}</small></span></label>`;});
    h+=`</div>`;
    const c=S.cands[S.pick];
    if(c&&c.kind==='street'){
      const e=S.est;
      h+=`<div class="blk"><h3>3 · Qatnov qismida nechta tasma?</h3>
      <div class="est ${S.userLanes?'okk':''}">${S.userLanes?'Siz tasdiqladingiz.':'Taxmin: '+esc(e.src)+'. Sputnikda tekshirib, toʻgʻrisini bosing.'}</div>
      <div class="seg"><button data-l="2-4" aria-pressed="${S.lanes==='2-4'}">${laneSvg(3)}<b>2–4 tasma</b><small>ikkala yoʻnalish birga</small></button><button data-l="5-8" aria-pressed="${S.lanes==='5-8'}">${laneSvg(6)}<b>5–8 tasma</b><small>ikkala yoʻnalish birga</small></button></div>
      <p class="hint"><a href="#" id="satg"><u>Sputnikda koʻrish</u></a> — avtomobil yoʻlagi chiziqlarini sanang. Tramvay, avtoturargoh va trotuar hisobga olinmaydi.</p></div>`;
    }
    if(c&&c.kind==='inner'){
      const cur=S.areaTip||(S.area&&S.area.tip);
      h+=`<div class="blk"><h3>3 · Hudud turi</h3><div class="est">${esc(S.area?S.area.why:'')}. Toʻgʻrisini tanlang.</div>`;
      [['Dam olish',['P1','P2','P3','P4','P5']],['Jamoat obyekti',['O1','O2','O3','O4']],['Mahalla',['M1','M2','M3','M4','M5']]].forEach(([g,l])=>{h+=`<div class="src" style="margin:10px 0 6px">${g.toUpperCase()}</div>`;
        l.forEach(t=>{h+=`<label class="opt ${cur===t?'on':''}"><input type="radio" name="a" value="${t}" ${cur===t?'checked':''}><span><b>${t} · ${TIPN[t]}</b><small>${esc(TIPD[t]||'')}</small></span></label>`;});});
      h+=`</div>`;
    }
    const r=result();
    if(r){h+=`<div class="blk"><h3>Natija</h3><div class="res"><div class="code">${r.tip}</div><div class="nm">${TIPN[r.tip]}</div><ul class="why">${r.why.map(([k,t,s])=>`<li class="${k}"><span>${esc(t)}${s?`<small>${esc(s)}</small>`:''}</span></li>`).join('')}</ul></div>
      <div style="margin-top:12px"><a class="btn dark wide" href="dizaynkod.html?tip=${r.tip}">Peshlavhani tekshirishga oʻtish →</a></div>
      <p class="src" style="margin-top:12px">Yashil — aniq; sariq — taxmin, tasdiqlang; kulrang — maʼlumot. Rasmiy chegaralar sxemasi (qarorning 3-bandi) chiqqach, tip undan olinadi.</p></div>`;}
  }
  h+=`<div class="blk src">Manba: Toshkent shahar Kengashining 2026-02-17 VII-19-17-14-0-K/26-son qarori, 1-ilova (8–15-bet), 3-ilova. Xarita maʼlumoti: © OpenStreetMap hissadorlari.</div>`;
  side.innerHTML=h;
  $('#sf').onsubmit=async ev=>{ev.preventDefault();const q=$('#q').value.trim();if(!q)return;
    try{const j=await (await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=uz&viewbox=69.10,41.42,69.47,41.17&bounded=1&q='+encodeURIComponent(q))).json();
      if(j[0]){map.setView([+j[0].lat,+j[0].lon],18);$('#mh').style.display='';$('#mh').textContent='Endi doʻkon kirishini bosing';}else alertBox('Topilmadi. Boshqacha yozib koʻring yoki xaritada qidiring.');}catch(e){alertBox('Qidiruv ishlamadi.');}};
  side.querySelectorAll('input[name=c]').forEach(x=>x.onchange=()=>{S.userLanes=false;S.areaTip=null;choose(+x.value);});
  side.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.lanes=b.dataset.l;S.userLanes=true;render();});
  side.querySelectorAll('input[name=a]').forEach(x=>x.onchange=()=>{S.areaTip=x.value;render();});
  const sg=$('#satg');if(sg)sg.onclick=ev=>{ev.preventDefault();setBase('sat');if(hl)map.fitBounds(hl.getBounds(),{maxZoom:19});else if(S.pt)map.setView(S.pt,19);};
}
function alertBox(m){const d=document.createElement('div');d.className='maphint';d.style.top='auto';d.style.bottom='24px';d.textContent=m;document.querySelector('.mapwrap').appendChild(d);setTimeout(()=>d.remove(),3500);}

map.on('click',e=>{if(S.busy)return;S.userLanes=false;S.areaTip=null;analyse(e.latlng.lat,e.latlng.lng);});
const qp=new URLSearchParams(location.search);if(qp.get('lat')&&qp.get('lon')){const la=+qp.get('lat'),lo=+qp.get('lon');map.setView([la,lo],18);analyse(la,lo);}
render();
})();
</script>
<script src="js/i18n.js?v=29"></script>
