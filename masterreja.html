<html lang="uz">

<title>Master reja — Archemistry Studio</title>

<style>
:root{--ink:#141414;--grey:#696969;--txt:#3c3c3c;--bg:#f4f3f1;--line:#dedcd7;--line2:#cfccc5;--bad:#b3261e;--ok:#2e7d4f;--blue:#2f5fa8;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:13px/1.45 Archivo,system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
header{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}.brand b{font-weight:500;font-size:13px;letter-spacing:.2em}.crumb{font-size:11px;letter-spacing:.14em;color:var(--grey)}.sp{flex:1}
.btn{height:30px;padding:0 12px;border:1px solid var(--ink);background:transparent;border-radius:2px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.dark{background:var(--ink);color:var(--bg)}.btn.ghost{border-color:var(--line2)}.btn.sm{height:26px;padding:0 9px;font-size:10.5px}.btn:disabled{opacity:.5}
main{flex:1;display:grid;grid-template-columns:290px 1fr 300px;min-height:0}
#nav{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:10px 0}
.ns{padding:4px 0 8px}.nsh{display:flex;gap:10px;padding:6px 14px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey)}.nsh b{color:var(--ink);font-weight:600;min-width:16px}
.nu{display:grid;grid-template-columns:34px 1fr auto;grid-template-rows:auto 2px;column-gap:6px;row-gap:4px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:6px 14px 6px 14px;font-size:12.5px}
.nu:hover{background:var(--bg)}.nu.on{background:var(--ink);color:#f4f3f1}.nu.on .np{color:#cfccc5}
.nn{font-family:var(--mono);font-size:11px;color:var(--grey)}.nu.on .nn{color:#cfccc5}.np{font-family:var(--mono);font-size:10.5px;color:var(--grey);display:flex;gap:4px;align-items:center}
.nu .bar{grid-column:2/4;height:2px;background:#efede9}.nu .bar s{display:block;height:100%}.d{width:7px;height:7px;border-radius:50%;display:inline-block}.d.bad{background:var(--bad)}
#main{overflow:auto;padding:22px}
.card{background:#fff;border:1px solid var(--line);max-width:1180px;margin:0 auto}
.ttl{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line)}
.num{background:var(--ink);color:#f4f3f1;min-width:46px;height:46px;padding:0 8px;display:grid;place-items:center;font-size:18px;font-weight:600}
h1{margin:0;font-size:24px;font-weight:500;letter-spacing:-.01em}.ru{font-size:12px;color:var(--grey);font-style:italic}
.done{font-size:12px;display:flex;gap:6px;align-items:center}
.cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0}
.ck{padding:16px 18px;border-right:1px solid var(--line)}.dr{padding:16px 18px}
.ckh,.drh{display:flex;justify-content:space-between;align-items:baseline;background:var(--ink);color:#f4f3f1;padding:8px 10px;margin-bottom:8px}.ckh b,.drh b{font-weight:600;letter-spacing:.08em;font-size:12px}.ckh span,.drh span{font-size:11px;color:#cfccc5}
table{width:100%;border-collapse:collapse}th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);font-weight:500;text-align:left;padding:4px 6px}
td{padding:7px 6px;border-top:1px solid #efede9;vertical-align:middle;font-size:12.5px}td.nm{text-align:center;font-weight:600;font-size:12px;width:120px}td.nm small{display:block;font-weight:400;font-style:italic;color:var(--blue);font-size:10.5px;margin-top:2px}
.mono{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--grey)}
.inp{display:flex;align-items:center;gap:4px}.inp input,td select,td textarea,.calc{width:100%;border:1px dashed var(--blue);background:#eef3fb;border-radius:2px;padding:5px 7px;font-family:var(--mono);font-size:12px;color:#1c3f78;min-width:0}
td textarea{font-family:Archivo;resize:vertical}td select.ok{border-style:solid;border-color:var(--ok);background:#eaf4ee}td select.no{border-style:solid;border-color:var(--bad);background:#fbecea}
.calc{border-style:solid;border-color:var(--line2);background:#f7f6f3;color:var(--ink)}.u{font-family:var(--mono);font-size:10.5px;color:var(--grey);white-space:nowrap;margin-left:4px}
.pull{border:1px solid var(--blue);background:#fff;color:var(--blue);width:24px;height:24px;flex:none;border-radius:2px;padding:0}
.st{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);font-style:normal;font-size:12px;font-weight:700}.st.ok{background:var(--ok);border-color:var(--ok);color:#fff}.st.bad{background:var(--bad);border-color:var(--bad);color:#fff}.st.fill,.st.na{background:#efede9}
#uNote{width:100%;border:1px solid var(--line2);border-radius:2px;padding:8px;font-size:12.5px;resize:vertical}
.slot{border:1px dashed var(--blue);min-height:280px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;padding:8px;background:#f6f5f2}
.slot.empty{display:grid;place-items:center;text-align:center;color:var(--blue);font-size:13px;padding:20px}
.slot figure{margin:0;background:#fff;border:1px solid var(--line)}.slot img{width:100%;height:150px;object-fit:contain;display:block;background:#fff}.slot figcaption{display:flex;justify-content:space-between;gap:6px;padding:5px 7px;font-size:11.5px;border-top:1px solid var(--line)}
.slot figcaption button{border:0;background:none;color:var(--bad)}
.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.tools{display:flex;flex-direction:column;gap:4px}.tool{border:1px solid var(--line2);padding:7px 10px;font-size:12.5px;background:#fff}.tool:hover{border-color:var(--ink)}
.tik{display:flex;justify-content:space-between;gap:16px;padding:10px 18px;border-top:1px solid var(--ink);font-size:12px}.tik span{color:var(--blue);font-style:italic;text-align:right}
.lbl{font-size:10px;letter-spacing:.14em;color:var(--grey);text-transform:uppercase;margin-bottom:6px}
.note{font-family:var(--mono);font-size:10.5px;color:var(--grey);line-height:1.55}.note.warn{color:#8a4b00;background:#fdf3e1;padding:8px;margin-top:8px}
#side{background:#fff;border-left:1px solid var(--line);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
#side .big{width:100%;border:1px solid var(--line2);padding:7px 8px;font-size:15px;font-weight:500;border-radius:2px}
.srcb{border:1px solid var(--line);padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:2px}.srcb>b{font-weight:500}.srcb>span{font-family:var(--mono);font-size:10.5px;color:var(--grey)}.srcb>a{font-size:11.5px;color:var(--blue);margin-top:4px}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid #f1efea}.kv b{font-family:var(--mono);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}.kpis div{padding:16px 18px;border-right:1px solid var(--line)}.kpis b{display:block;font-size:30px;font-weight:500}.kpis span{font-size:11px;color:var(--grey)}.kpis .b b{color:var(--bad)}
table.sum{margin:0 18px;width:calc(100% - 36px)}table.sum tr[data-u]{cursor:pointer}table.sum tr[data-u]:hover{background:var(--bg)}td.ok{color:var(--ok);font-family:var(--mono)}td.bad{color:var(--bad);font-family:var(--mono)}
.ov{position:fixed;inset:0;background:rgba(20,20,20,.35);z-index:900;display:grid;place-items:center;padding:30px}
.dlg{background:#fff;border:1px solid var(--ink);width:100%;max-width:980px;max-height:90vh;display:flex;flex-direction:column}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.dh:last-child{border-top:1px solid var(--line);border-bottom:0}.dh .x:not(.btn){border:0;background:none;font-size:16px}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding:14px;overflow:auto}.mg button{border:1px solid var(--line);background:#fff;padding:0;text-align:left;display:flex;flex-direction:column}
.mg button.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}.mg img{width:100%;height:110px;object-fit:contain;background:#f6f5f2}.mg span{font-size:12px;padding:5px 7px 0}.mg small{font-family:var(--mono);font-size:10px;color:var(--grey);padding:0 7px 6px}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:1000}.toast{background:var(--ink);color:#f4f3f1;padding:9px 14px;font-size:12.5px;border-radius:2px;display:flex;gap:12px;align-items:center}.toast button{border:1px solid #f4f3f1;background:none;color:#f4f3f1;font-size:11px;padding:3px 8px}
@media (max-width:1200px){main{grid-template-columns:240px 1fr}#side{display:none}.cols{grid-template-columns:1fr}.ck{border-right:0;border-bottom:1px solid var(--line)}}
</style>

function fmt(v,d){if(v==null||v==='')return '—';if(typeof v!=='number')return String(v);const a=Math.abs(v),dd=d!=null?d:a>=100?0:a>=10?1:2;return v.toLocaleString('ru-RU',{maximumFractionDigits:dd,minimumFractionDigits:0}).replace(/ /g,' ');}

function vals(){const V={};ROWS.forEach(r=>{if(r.t==='num'){const x=M.v[r.k];V[r.k]=x===''||x==null?null:+x;}else if(r.t==='txt'||r.t==='area')V[r.k]=M.v[r.k]||null;else if(r.t==='yn')V[r.k]=M.yn[r.k]||null;});
  for(let i=0;i<4;i++)ROWS.forEach(r=>{if(r.t==='calc'){try{const x=r.o.f(V);V[r.k]=x==null||(typeof x==='number'&&!isFinite(x))?null:x;}catch(e){V[r.k]=null;}}});return V;}
function status(r,V){const v=V[r.k];if(r.t==='yn')return v==='ok'?'ok':v==='no'?'bad':v==='na'?'na':null;if(v==null||v==='')return null;
  if(typeof v==='number'){const o=r.o;if(o.op==='<=')return v<=o.v?'ok':'bad';if(o.op==='>=')return v>=o.v?'ok':'bad';if(o.op==='in')return v>=o.v&&v<=o.v2?'ok':'bad';if(o.opf){const t=o.opf(V);if(t==null)return 'fill';return v>=t?'ok':'bad';}}
  return 'fill';}
function subStat(u,V){let ok=0,bad=0,fill=0,tot=0;u.rows.forEach(rr=>{const r=ROWS.find(x=>x.k===rr[0]);tot++;const s=status(r,V);if(s==='ok')ok++;else if(s==='bad')bad++;else if(s==='fill'||s==='na')fill++;});const att=(M.att[u.id]||[]).length;return {ok,bad,fill,tot,empty:tot-ok-bad-fill,att};}

function tikLine(u,V){const parts=u.rows.map(rr=>{const r=ROWS.find(x=>x.k===rr[0]),v=V[r.k];if(v==null||v===''||r.t==='area')return null;const vv=r.t==='yn'?{ok:'✓',no:'✗',na:'—'}[v]:typeof v==='number'?fmt(v):v;return `${r.n.replace(/ \(.*\)$/,'')}: ${vv}${r.o.u&&r.t!=='yn'?' '+r.o.u:''}`;}).filter(Boolean);return parts.slice(0,5).join(' | ');}

   <label class="note"><input type="checkbox" id="pullEmpty" checked> faqat boʻsh maydonlarni</label></div>
  <div><div class="lbl">Shablon haqida</div><div class="note">Tuzilma Urbanizatsiya qoʻmitasining master-reja shabloniga mos: har bir boʻlimda chapda muvofiqlik roʻyxati (norma / loyiha / ✓✗), oʻngda chizma, pastda TIK va ShNQ havolasi. Normativ qiymatlar shablondan olingan.</div>
   <div class="note warn">Shablonning oʻzida ayrim nomuvofiqliklar bor: avtoturargoh meʼyori 6.5 va 3-boʻlimda 0,7 joy/kv., 6.3 da esa ≥ 1,0; seysmiklik 1.6 va 5-boʻlimda 8 ball, TIK satrlarida 9 ball. Topshirishdan oldin aniqlang.</div></div>`;
  $('#mName').onchange=e=>{M.name=e.target.value;save();};$('#pull').onclick=()=>{const n=pullAll($('#pullEmpty').checked);toast(n?n+' ta maydon portaldan toʻldirildi.':'Yangi qiymat topilmadi — avval Joylashtirish yoki Hudud tahlilida hisoblang.');renderAll();};}
function renderAll(){renderNav();renderMain();renderSide();}
/* ---- AI qoralama ---- */
async function aiDraft(u){const key=localStorage.getItem('kps_ai_key');if(!key){toast('AI kaliti kiritilmagan — Hudud tahlili sahifasida «AI kaliti».');return;}const V=vals(),model=localStorage.getItem('kps_ai_model')||'claude-sonnet-5';
  const facts=ROWS.filter(r=>V[r.k]!=null&&V[r.k]!=='').map(r=>`${r.sub.id} ${r.n}: ${typeof V[r.k]==='number'?fmt(V[r.k]):V[r.k]}${r.o.u?' '+r.o.u:''} (norma: ${r.norm}${r.ref?', '+r.ref:''})`).join('\n');const {ai}=srcData();
  const b=$('#uAI');b.disabled=true;b.textContent='AI yozmoqda…';
  try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model,max_tokens:1200,system:'Sen Oʻzbekistondagi master-reja boʻyicha urbanist-maslahatchisan. Faqat oʻzbek (lotin) tilida, qisqa va aniq yoz. Faqat berilgan raqamlarga tayan, yangi raqam yoki normativ band oʻylab topma. Maʼlumot yetishmasa, buni ochiq ayt.',
      messages:[{role:'user',content:`Loyiha: ${M.name}\nBoʻlim: ${u.id} ${u.t}\nVazifa: ${u.ai}\n\nMaster-reja maydonlari:\n${facts||'(hali kiritilmagan)'}\n\nHudud tahlili (OSM):\n${ai?JSON.stringify(ai).slice(0,3500):'yoʻq'}`}]})});
    const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||r.status);const txt=(j.content||[]).map(c=>c.text||'').join('').trim();
    M.note[u.id]=(M.note[u.id]?M.note[u.id]+'\n\n':'')+txt;save();renderAll();toast('AI qoralamasi «Izoh» maydoniga qoʻshildi — tekshirib chiqing.');}catch(e){toast('AI xatosi: '+e.message);b.disabled=false;}}
/* ---- fayl ---- */
$('#fSave').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({kps_mr:1,M},null,1)],{type:'application/json'}));a.download=(M.name||'master-reja').replace(/[^\wʻʼ\- ]+/g,'')+'.json';a.click();};
$('#fOpen').onclick=()=>$('#fIn').click();$('#fIn').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);if(!j.kps_mr)throw 0;M=Object.assign(DEF(),j.M);save();renderAll();toast('Ochildi: '+M.name);}catch(err){toast('Bu master reja fayli emas.');}});e.target.value='';};
$('#fNew').onclick=()=>{const old=JSON.stringify(M);M=DEF();save();renderAll();toast('Yangi master reja boshlandi.','Bekor qilish',()=>{M=JSON.parse(old);save();renderAll();});};
/* ---- shablon boʻyicha albom yaratish ---- */
const svgURL=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
function wrap(t,n){const out=[];String(t||'').split('\n').forEach(par=>{let l='';par.split(' ').forEach(w=>{if((l+' '+w).trim().length>n){if(l)out.push(l);l=w;}else l=(l+' '+w).trim();});out.push(l);});return out;}
const xe=s=>esc(s).replace(/'/g,'&#39;');
function ckSVG(u,V){const W=600,rh=44,head=64,rows=u.rows.map(rr=>ROWS.find(x=>x.k===rr[0]));const Hh=head+rows.length*rh+6;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${Hh}" font-family="Archivo, Arial, sans-serif"><rect width="${W}" height="${Hh}" fill="#fff" stroke="#dedcd7"/><rect width="${W}" height="34" fill="#141414"/><text x="14" y="23" font-size="15" font-weight="600" fill="#f4f3f1" letter-spacing="1">MUVOFIQLIK ROʻYXATI</text>
  <text x="14" y="54" font-size="11" fill="#696969" letter-spacing=".8">KOʻRSATKICH</text><text x="372" y="54" font-size="11" fill="#696969" text-anchor="middle" letter-spacing=".8">NORMA</text><text x="500" y="54" font-size="11" fill="#696969" text-anchor="middle" letter-spacing=".8">LOYIHA</text>`;
  rows.forEach((r,i)=>{const y=head+i*rh,st=status(r,V),v=V[r.k],vv=r.t==='yn'?{ok:'✓',no:'✗',na:'—'}[v]||'___':v==null||v===''?'___':typeof v==='number'?fmt(v)+(r.o.u?' '+r.o.u:''):String(v).slice(0,18);
    const L=wrap(r.n,34).slice(0,2),N=wrap(r.norm,16).slice(0,2);
    s+=`${i%2?`<rect x="1" y="${y}" width="${W-2}" height="${rh}" fill="#f7f6f3"/>`:''}${L.map((l,j)=>`<text x="14" y="${y+(L.length>1?17+j*15:26)}" font-size="13" font-weight="${j?400:500}" fill="#141414">${xe(l)}</text>`).join('')}
      ${N.map((l,j)=>`<text x="372" y="${y+(r.ref?15:24)+j*13}" font-size="12.5" font-weight="600" text-anchor="middle" fill="#141414">${xe(l)}</text>`).join('')}${r.ref?`<text x="372" y="${y+(N.length>1?41:32)}" font-size="9.5" text-anchor="middle" fill="#2f5fa8" font-style="italic">${xe(r.ref.slice(0,30))}</text>`:''}
      <rect x="448" y="${y+8}" width="104" height="${rh-16}" fill="#eef3fb" stroke="#2f5fa8" stroke-dasharray="3 2"/><text x="500" y="${y+rh/2+5}" font-size="13" text-anchor="middle" fill="#1c3f78">${xe(vv)}</text>
      <circle cx="576" cy="${y+rh/2}" r="9" fill="${st==='ok'?'#2e7d4f':st==='bad'?'#b3261e':'#fff'}" stroke="${st==='ok'||st==='bad'?'none':'#cfccc5'}"/>${st==='ok'||st==='bad'?`<text x="576" y="${y+rh/2+4.5}" font-size="12" text-anchor="middle" fill="#fff" font-weight="700">${st==='ok'?'✓':'✗'}</text>`:''}`;});
  return {src:svgURL(s+'</svg>'),aspect:W/Hh};}
const T=(x,y,w,text,o={})=>Object.assign({id:uid(),t:'text',x,y,w,h:(o.fs||10)*.3528*1.4*(String(text).split('\n').length),text,ff:'Archivo',fs:10,col:'#141414',al:'l',layer:'L0'},o);
const RC=(x,y,w,h,o={})=>Object.assign({id:uid(),t:'rect',x,y,w,h,fill:null,stroke:null,sw:0,op:1,layer:'L0'},o);
function frame(name,right){return [RC(0,0,420,11,{fill:'#141414'}),T(8,2.6,260,name,{fs:10.5,col:'#f4f3f1'}),T(160,2.6,252,right,{fs:10.5,col:'#f4f3f1',al:'r'})];}
function placeMats(ids,x,y,w,h){const ms=ids.map(id=>MATS.find(m=>m.id===id)).filter(Boolean).slice(0,4);if(!ms.length)return [];const n=ms.length,cols=n>1?2:1,rows=Math.ceil(n/cols),g=4,cw=(w-(cols-1)*g)/cols,ch=(h-(rows-1)*g)/rows;
  return ms.map((m,i)=>{const a=m.aspect||1.5,cx=x+(i%cols)*(cw+g),cy=y+Math.floor(i/cols)*(ch+g);let ww=cw,hh=cw/a;if(hh>ch){hh=ch;ww=ch*a;}return {id:uid(),t:'mat',src:m.src,name:m.name,aspect:a,mW:null,frame:false,x:cx+(cw-ww)/2,y:cy+(ch-hh)/2,w:ww,h:hh,layer:'L0'};});}
function subPage(u,V){const it=[...frame(M.name,`${u.sec.id==='★'?'':u.sec.id+'-boʻlim · '}${u.sec.t}`)];
  it.push(RC(10,17,18,17,{fill:'#141414'}),T(10,21.2,18,u.id,{fs:u.id.length>3?13:17,col:'#f4f3f1',al:'c',b:true}),T(32,16.5,370,u.t,{fs:21,b:false}),T(32,27,370,u.ru,{fs:10,col:'#696969',i:true}));
  let yb=40;if(u.rows.length){const c=ckSVG(u,V),w=150,h=w/c.aspect;it.push({id:uid(),t:'image',src:c.src,aspect:c.aspect,x:10,y:40,w,h,name:'Muvofiqlik roʻyxati',layer:'L0'});yb=40+h+5;}
  const note=M.note[u.id];if(note&&yb<250){const lines=wrap(note,(u.rows.length?78:78)).slice(0,Math.max(2,Math.floor((270-yb)/4.6)));it.push(T(10,yb,150,lines.join('\n'),{fs:9,col:'#3c3c3c',lh:1.3}));}
  const att=M.att[u.id]||[],X=u.rows.length||note?168:10,W2=410-X;
  if(att.length)it.push(...placeMats(att,X,40,W2,230));else{it.push(RC(X,40,W2,230,{fill:'#f6f5f2',stroke:'#2f5fa8',sw:.35,ls:'dash'}),T(X+10,148,W2-20,'CHIZMA: '+(u.draw||''),{fs:12,col:'#2f5fa8',al:'c'}));}
  const tik=tikLine(u,V);it.push({id:uid(),t:'line',pts:[[10,276],[410,276]],stroke:'#141414',sw:.3,op:1,layer:'L0'},T(10,278.5,400,wrap('TIK: '+(tik||'___'),190).slice(0,2).join('\n'),{fs:8,b:true,lh:1.3}),T(10,288.5,400,wrap(refs(u),210)[0]||'',{fs:7.5,col:'#2f5fa8',i:true}));
  return {id:uid(),fmt:'A3',orient:'L',tb:false,items:it,name:u.id+' '+u.t};}
function titlePage(V){const it=[RC(0,0,420,297,{fill:'#f4f3f1'}),RC(0,0,12,297,{fill:'#141414'}),T(30,40,360,'MASTER REJA',{fs:14,col:'#696969'}),T(30,52,380,M.name,{fs:40}),T(30,80,360,'Urbanizatsiya qoʻmitasi shabloni asosida · ShNQ 2.07.01-23',{fs:12,col:'#3c3c3c'})];
  const k=[['Maydon',V.maydon,'ga'],['Kvartiralar',V.kv,'ta'],['Aholi',V.aholi,'kishi'],['FAR',V.far,''],['Aholi zichligi',V.zich,'kishi/ga'],['Avtoturargoh',V.park_jami,'joy']].filter(x=>x[1]!=null);
  k.forEach((x,i)=>{const cx=30+(i%3)*120,cy=150+Math.floor(i/3)*40;it.push(T(cx,cy,110,x[0].toUpperCase(),{fs:9,col:'#696969'}),T(cx,cy+6,110,fmt(x[1])+(x[2]?' '+x[2]:''),{fs:22}));});
  it.push(T(30,270,360,'Archemistry Studio · '+new Date().toLocaleDateString('ru-RU'),{fs:9,col:'#696969'}));return {id:uid(),fmt:'A3',orient:'L',tb:false,items:it,name:'Titul'};}
function tocPage(list){const it=[...frame(M.name,'Mundarija'),T(20,22,380,'Mundarija',{fs:24})];let y=44;SEC.forEach(s=>{const subs=s.subs.filter(u=>list.includes(u));if(!subs.length)return;it.push(T(20,y,380,`${s.id}   ${s.t}`,{fs:12,b:true}));y+=6.5;
  subs.forEach(u=>{it.push(T(34,y,330,`${u.id}  ${u.t}`,{fs:10,col:'#3c3c3c'}),T(360,y,40,String(list.indexOf(u)+3),{fs:10,col:'#696969',al:'r'}));y+=5.2;});y+=2;});
  return {id:uid(),fmt:'A3',orient:'L',tb:false,items:it,name:'Mundarija'};}
function sumPage(V){const W=900,rh=30;const rows=SEC.map(s=>{const a={ok:0,bad:0,empty:0};s.subs.forEach(u=>{const x=subStat(u,V);a.ok+=x.ok;a.bad+=x.bad;a.empty+=x.empty;});return [s,a];});const Hh=50+rows.length*rh;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${Hh}" font-family="Archivo, Arial, sans-serif"><rect width="${W}" height="${Hh}" fill="#fff"/><text x="10" y="30" font-size="13" fill="#696969">BOʻLIM</text><text x="640" y="30" font-size="13" fill="#696969" text-anchor="middle">✓</text><text x="740" y="30" font-size="13" fill="#696969" text-anchor="middle">✗</text><text x="840" y="30" font-size="13" fill="#696969" text-anchor="middle">BOʻSH</text>`;
  rows.forEach(([sec,a],i)=>{const y=50+i*rh;s+=`<line x1="0" x2="${W}" y1="${y-20}" y2="${y-20}" stroke="#dedcd7"/><text x="10" y="${y}" font-size="15">${xe(sec.id+'  '+sec.t)}</text><text x="640" y="${y}" font-size="15" text-anchor="middle" fill="#2e7d4f">${a.ok}</text><text x="740" y="${y}" font-size="15" text-anchor="middle" fill="#b3261e">${a.bad||''}</text><text x="840" y="${y}" font-size="15" text-anchor="middle" fill="#696969">${a.empty||''}</text>`;});
  const it=[...frame(M.name,'Yakuniy baho'),RC(10,17,18,17,{fill:'#141414'}),T(10,21.2,18,'Σ',{fs:17,col:'#f4f3f1',al:'c'}),T(32,16.5,370,'Yakuniy baho',{fs:21}),T(32,27,370,'Сводная оценка по разделам',{fs:10,col:'#696969',i:true}),{id:uid(),t:'image',src:svgURL(s+'</svg>'),aspect:W/Hh,x:10,y:42,w:300,h:300*Hh/W,layer:'L0'}];
  return {id:uid(),fmt:'A3',orient:'L',tb:false,items:it,name:'Yakuniy baho'};}
function albumDlg(){const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="dlg" style="max-width:520px"><div class="dh"><b>Shablon boʻyicha albom yaratish</b><button class="x">✕</button></div><div style="padding:16px;display:flex;flex-direction:column;gap:10px;font-size:13px">
  <label><input type="radio" name="sc" value="filled" checked> Faqat toʻldirilgan yoki chizmasi bor boʻlimlar</label><label><input type="radio" name="sc" value="all"> Barcha boʻlimlar (boʻshlari shablon sifatida)</label><hr>
  <label><input type="checkbox" id="aTit" checked> Titul varaq</label><label><input type="checkbox" id="aToc" checked> Mundarija</label><label><input type="checkbox" id="aSum" checked> Yakuniy baho (Σ)</label><hr>
  <label><input type="radio" name="md" value="add" checked> Mavjud albom oxiriga qoʻshish</label><label><input type="radio" name="md" value="new"> Albomni almashtirish (eskisi oʻchadi)</label>
  <div class="note">Varaqlar A3 albom formatida: chapda muvofiqlik roʻyxati, oʻngda chizma, pastda TIK. Albom sahifasi boshqa oynada ochiq boʻlsa, uni yoping yoki yangilang — aks holda u eski holatini qayta saqlaydi.</div>
  <button class="btn dark" id="aGo">Yaratish</button></div></div>`;document.body.appendChild(ov);ov.querySelector('.x').onclick=()=>ov.remove();
  $('#aGo').onclick=async()=>{const V=vals(),sc=ov.querySelector('[name=sc]:checked').value,md=ov.querySelector('[name=md]:checked').value;
    const list=ALL.filter(u=>{if(sc==='all')return true;const x=subStat(u,V);return (x.tot-x.empty)>0||x.att||M.note[u.id];});if(!list.length){toast('Hali toʻldirilgan boʻlim yoʻq.');return;}
    let doc=null;try{doc=(await getAll('kps_maket','docs')).find(d=>d.id==='main');}catch(e){}
    if(!doc||md==='new')doc={id:'main',name:M.name,meta:{author:'',proj:M.name},pages:[],layers:[{id:'L0',name:'Asosiy',vis:true,lock:false}]};
    const pages=[];if($('#aTit').checked)pages.push(titlePage(V));if($('#aToc').checked)pages.push(tocPage(list));list.forEach(u=>pages.push(subPage(u,V)));if($('#aSum').checked)pages.push(sumPage(V));
    doc.pages=doc.pages.filter(p=>p.items&&p.items.length).concat(pages);if(!doc.layers||!doc.layers.length)doc.layers=[{id:'L0',name:'Asosiy',vis:true,lock:false}];
    try{await putRec('kps_maket','docs',doc);}catch(e){toast('Albom saqlanmadi: '+e.message);return;}ov.remove();toast(pages.length+' ta varaq albomga qoʻshildi.','Albomni ochish',()=>window.open('maket.html','_blank'));};}
$('#mkAlb').onclick=albumDlg;
(async()=>{await loadMats();renderAll();})();
})();
