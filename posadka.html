<style>

.kv.big b{font-size:16px}
.grid{display:grid;grid-template-columns:1fr 70px 70px;gap:5px 8px;align-items:center;font-size:12px}
.grid input,.f input,.f select{width:100%;border:1px solid var(--line2);border-radius:2px;padding:4px 6px;font-family:var(--mono);font-size:12px;background:#fff}

.bar{display:flex;height:12px;border-radius:2px;overflow:hidden;background:#efede9}
.note{font-family:var(--mono);font-size:10.5px;color:var(--grey);line-height:1.55}
.sel{border:1px solid var(--ink);padding:12px;display:flex;flex-direction:column;gap:10px}

function setTool(t){tool=t;pts=[];renderRail();drawTmp();hint();render();map.getContainer().style.cursor=t==='sel'?'':'crosshair';}
function hint(){const h=$('#hint');const m={sel:'<b>Tanlash.</b> Binoni yoki hududni bosing — xususiyatlari oʻngda. Uchlarini sudrab oʻzgartiring. Delete — oʻchirish.',

    let st=null;mv.on('dragstart',()=>{st={c:c.slice(),poly:s.poly.map(p=>p.slice())};});mv.on('drag',ev=>{const q=ev.target.getLatLng(),d=[q.lat-st.c[0],q.lng-st.c[1]];s.poly=st.poly.map(p=>[p[0]+d[0],p[1]+d[1]]);if(sel.t==='s')P.site=s.poly;else if(sel.t==='b')P.blds.find(b=>b.id===sel.id).poly=s.poly;G.clearLayers();render.light();});mv.on('dragend',()=>commit());}

render.light=()=>{const keep=sel;const s=selObj();P.site&&L.polygon(P.site,{color:'#e8775f',weight:2.5,dashArray:'8 5',fillOpacity:.04,interactive:false}).addTo(G);P.greens.forEach(g=>L.polygon(g.poly,{color:'#4f7f3c',weight:1,fillColor:'#8cc37a',fillOpacity:.55,interactive:false}).addTo(G));P.parks.forEach(g=>L.polygon(g.poly,{color:'#696969',weight:1,fillColor:'#d6d4cf',fillOpacity:.8,interactive:false}).addTo(G));P.blds.forEach(b=>L.polygon(b.poly,{color:'#6a5a9a',weight:1.2,fillColor:USES[b.use][1],fillOpacity:.92,interactive:false}).addTo(G));};
function cent(poly){let x=0,y=0;poly.forEach(p=>{x+=p[0];y+=p[1];});return [x/poly.length,y/poly.length];}
function selObj(){if(!sel)return null;if(sel.t==='s')return P.site?{poly:P.site}:null;const a=sel.t==='b'?P.blds:sel.t==='g'?P.greens:P.parks;return a.find(x=>x.id===sel.id)||null;}

const HIST={a:[],i:-1};function commit(){save();HIST.a=HIST.a.slice(0,HIST.i+1);HIST.a.push(JSON.stringify(P));HIST.i=HIST.a.length-1;render();}

function gj3(){const f=[];const c=x=>x.map(p=>[p[1],p[0]]).concat([[x[0][1],x[0][0]]]);
  P.blds.forEach(b=>{const gf=b.use==='res'&&b.gf&&b.gf!=='res'&&b.fl>1;f.push({type:'Feature',properties:{h:b.fl*P.p.fh,b:gf?P.p.fh:0,c:USES[b.use][1]},geometry:{type:'Polygon',coordinates:[c(b.poly)]}});if(gf)f.push({type:'Feature',properties:{h:P.p.fh,b:0,c:USES.com[1]},geometry:{type:'Polygon',coordinates:[c(b.poly)]}});});

async function open3d(){try{if(!window.maplibregl){const l=document.createElement('link');l.rel='stylesheet';l.href='https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css';document.head.appendChild(l);await loadScript('https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js');}}catch(e){toast('3D ochilmadi: '+e.message);return;}

$('#sForm').onsubmit=async e=>{e.preventDefault();const q=$('#sQ').value.trim();const m=q.match(/^\s*(-?\d+(?:[.,]\d+)?)\s*[, ]\s*(-?\d+(?:[.,]\d+)?)\s*$/);

function planSVGm(){if(!P.site&&!P.blds.length)return null;const all=[...(P.site||[]),...P.blds.flatMap(b=>b.poly),...P.greens.flatMap(g=>g.poly),...P.parks.flatMap(g=>g.poly)].map(xy);

  return {svg:s+'</svg>',mW:W,aspect:W/Hh};}
$('#toMk').onclick=async()=>{const pl=planSVGm();if(!pl){toast('Avval uchastka yoki bino chizing.');return;}const c=calc(),t=new Date().toISOString();
  const put=o=>new Promise((res,rej)=>{const r=indexedDB.open('kps_mat',1);r.onupgradeneeded=()=>r.result.createObjectStore('mats',{keyPath:'id'});r.onsuccess=()=>{const tx=r.result.transaction('mats','readwrite');tx.objectStore('mats').put(o);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);};r.onerror=()=>rej(r.error);});

  const s2='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(tsvg);await put({id:'pt'+Date.now().toString(36),kind:'svg',name:'Posadka — koʻrsatkichlar jadvali',src:s2,thumb:s2,aspect:tw/(rows.length*th+30),sub:'jadval',t});
  toast('Bosh reja va jadval Maketga yuborildi.');};
$('#pName').value=P.name;$('#pName').onchange=e=>{P.name=e.target.value;save();};
