  <label>Hisob sanasi<select id="nDate">${[['03-22','22 mart'],['04-22','22 aprel'],['06-22','22 iyun'],['08-22','22 avgust'],['09-22','22 sentabr'],['12-22','22 dekabr']].map(([v,t])=>`<option value="${v}" ${n.date===v?'selected':''}>${t}</option>`).join('')}</select></label>

  <label>Hisob vaqti: dan, soat<input type="number" step="0.5" id="nT0" value="${n.t0}" placeholder="quyosh chiqishi"></label><label>gacha, soat<input type="number" step="0.5" id="nT1" value="${n.t1}" placeholder="quyosh botishi"></label>
  <div class="full" style="font-size:10.5px;color:var(--grey)">Yongʻinga qarshi masofa, m — darajalar juftligi boʻyicha (meʼyoriy jadvaldan kiriting)</div>
  ${[[0,0],[0,1],[0,2],[1,1],[1,2],[2,2]].map(([a,b])=>`<label>${FRK[a]} ↔ ${FRK[b]}<input type="number" step="0.5" data-fm="${fmKey(FRK[a],FRK[b])}" value="${n.fm[fmKey(FRK[a],FRK[b])]||''}" placeholder="—"></label>`).join('')}<label class="full">Asos (ShNQ bandi)<input id="nRef" value="${esc(n.ref)}" placeholder="masalan: ShNQ 2.07.01-23, … band"></label></div>`;
  if(a.dist&&P.blds.length>1){const r=distances(),bad=r.all.filter(o=>o.ok===false).length,mn=Math.min(...r.all.map(o=>o.d));h+=`<div class="kv"><span>Eng yaqin binolar oraligʻi</span><b>${f1(mn)} m</b></div>${r.all.some(o=>o.req)?`<div class="kv"><span>Talabga javob bermaydi</span><b style="color:${bad?'var(--bad)':'var(--ok)'}">${bad} juft</b></div>`:''}${r.sb.length?`<div class="kv"><span>Chekinish buzilgan</span><b style="color:${r.sb.some(o=>!o.ok)?'var(--bad)':'var(--ok)'}">${r.sb.filter(o=>!o.ok).length} bino</b></div>`:''}`;}
  if(a.ins&&INS&&INS.length){const thr=+n.ins,worst=Math.min(...INS.map(o=>o.best));h+=`<div class="kv"><span>Hisob nuqtalari</span><b>${INS.length}</b></div><div class="kv"><span>Eng kam uzluksiz insolyatsiya</span><b>${hm(worst)}</b></div>${thr?`<div class="kv"><span>Talabdan kam nuqtalar</span><b style="color:${INS.some(o=>o.best<thr)?'var(--bad)':'var(--ok)'}">${INS.filter(o=>o.best<thr).length}</b></div>`:''}
    <div class="chk"><i style="background:hsl(0,85%,30%)"></i>0 soat<i style="background:hsl(22,85%,42%);margin-left:8px"></i>3<i style="background:hsl(45,85%,55%);margin-left:8px"></i>6+ soat${thr?' · talab kiritilgan: yashil/qizil':''}</div>`;}
  h+=`<div style="margin-top:10px;display:flex;gap:6px;align-items:end;flex-wrap:wrap"><button class="btn sm ghost" id="nCtx">Atrofdagi binolarni yuklash (OSM)</button>${(P.ctx||[]).length?`<button class="btn sm ghost" id="nCtxX">Tozalash (${P.ctx.length})</button>`:''}<label style="font-size:10.5px;color:var(--grey);display:flex;flex-direction:column">Qavati nomaʼlum binolar<input id="nCtxLv" type="number" min="1" value="${n.ctxLv}" placeholder="2" style="width:70px;border:1px solid var(--line2);padding:3px 5px;font-family:var(--mono)"></label></div>
  <div class="note">Atrofdagi mavjud binolar soya va masofa hisobiga qoʻshiladi; TIK ga kirmaydi. Uchastka ichidagi (buziladigan) binolar olinmaydi.</div>`;
  h+=`<div class="note" style="margin-top:6px">Geometrik hisob: quyosh holati (kenglik ${f2(lat0())}°, quyosh vaqti, 5 daqiqa qadam), fasad oldidagi nuqtalar, boshqa binolar soyasi. Faqat turar joy binolari fasadlari. Me'yoriy qiymatlar avtomatik qoʻyilmaydi — amaldagi ShNQ 2.07.01-23 va sanitariya qoidalaridan oʻzingiz kiriting${n.ref?' · asos: '+esc(n.ref):''}. Atrofdagi binolar uchun yuqoridagi tugmadan foydalaning.</div></div>`;
  return h;}
function bindNorm(){const n=N(),a=AN0();const tg=(id,k)=>{const b=$(id);if(b)b.onclick=()=>{a[k]=!a[k];if(k==='ins'&&a[k])INSkey='';commit();};};tg('#nDist','dist');tg('#nIns','ins');
  document.querySelectorAll('[data-fm]').forEach(i=>i.onchange=()=>{n.fm[i.dataset.fm]=i.value;commit();});
  if($('#nCtx'))$('#nCtx').onclick=loadCtx;if($('#nCtxX'))$('#nCtxX').onclick=()=>{P.ctx=[];INSkey='';commit();};
  [['#nT0','t0'],['#nT1','t1'],['#nCtxLv','ctxLv'],['#nDmin','dmin'],['#nDk','dk'],['#nSb','setb'],['#nIh','ins'],['#nDate','date'],['#nWz','wz'],['#nRef','ref']].forEach(([id,k])=>{const i=$(id);if(i)i.onchange=()=>{n[k]=i.value;commit();};});}
async function loadCtx(){const src=P.site||P.blds.flatMap(b=>b.poly);if(!src.length){toast('Avval uchastka yoki bino chizing.');return;}const pad=200;const la=src.map(p=>p[0]),lo=src.map(p=>p[1]);
  const bb=[Math.min(...la)-pad/MY,Math.min(...lo)-pad/MX(),Math.max(...la)+pad/MY,Math.max(...lo)+pad/MX()].map(v=>v.toFixed(6)).join(',');toast('OSM dan binolar yuklanmoqda…');
  try{const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(`[out:json][timeout:60];way["building"](${bb});out geom tags;`)});const j=await r.json();const lv0=+N().ctxLv||2;
    const inSite=p=>{if(!P.site)return false;let c=false;const S=P.site;for(let i=0,k=S.length-1;i<S.length;k=i++){if(((S[i][0]>p[0])!==(S[k][0]>p[0]))&&(p[1]<(S[k][1]-S[i][1])*(p[0]-S[i][0])/(S[k][0]-S[i][0])+S[i][1]))c=!c;}return c;};
    P.ctx=j.elements.filter(w=>w.geometry&&w.geometry.length>3).map(w=>{const poly=w.geometry.slice(0,-1).map(g=>[g.lat,g.lon]);const t=w.tags||{},h=parseFloat(t.height)||(parseFloat(t['building:levels'])||lv0)*P.p.fh;return {poly,h:+h.toFixed(1)};}).filter(x=>!inSite(cent(x.poly)));
    INSkey='';commit();toast(P.ctx.length+' ta mavjud bino qoʻshildi.');}catch(e){toast('OSM soʻrovi bajarilmadi: '+e.message);}}
function posLegend(){const used=new Set(P.blds.map(b=>b.use));const out=[];Object.entries(USES).forEach(([k,[n,c]])=>{if(used.has(k))out.push({col:c,label:n,kind:'fill',on:true});});
  if(P.greens.length)out.push({col:'#cfe3c4',label:'Yashil hudud',kind:'fill',on:true});if(P.parks.length)out.push({col:'#e6e4df',label:'Avtoturargoh',kind:'fill',on:true});if(P.site)out.push({col:'#e8775f',label:'Uchastka chegarasi',kind:'line',on:true});if((P.ctx||[]).length)out.push({col:'#cfccc5',label:'Mavjud binolar',kind:'fill',on:true});return out;}

/* ---- qidiruv, eksport ---- */
$('#sForm').onsubmit=async e=>{e.preventDefault();const q=$('#sQ').value.trim();const m=q.match(/^\s*(-?\d+(?:[.,]\d+)?)\s*[, ]\s*(-?\d+(?:[.,]\d+)?)\s*$/);
  if(m){map.setView([+m[1].replace(',','.'),+m[2].replace(',','.')],18);return;}
  try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=uz&q='+encodeURIComponent(q));const j=await r.json();if(j[0])map.setView([+j[0].lat,+j[0].lon],17);else toast('Topilmadi');}catch(err){toast('Qidiruv ishlamadi');}};
$('#csv').onclick=()=>{const c=calc(),rows=[['Koʻrsatkich','Qiymat','Birlik'],['Uchastka maydoni',(c.site/1e4).toFixed(3),'ga'],['Qurilish dogʻi',c.fp.toFixed(0),'m²'],['Qurilish ulushi',c.cov.toFixed(1),'%'],['Umumiy qavatlar maydoni',c.gfa.toFixed(0),'m²'],['FAR (KPZ)',c.far.toFixed(2),''],['Oʻrtacha qavatlilik',c.avgFl.toFixed(1),''],['Yashil hudud',c.green.toFixed(0),'m²'],['Turar joy GFA',c.res.toFixed(0),'m²'],['Notijorat GFA',c.nonres.toFixed(0),'m²'],['Sotiladigan turar joy',c.sell.toFixed(0),'m²'],...c.apts.map(a=>[a.r+' xonali kvartiralar',a.n,'dona']),['Kvartiralar jami',c.na,'dona'],['Aholi',c.pop.toFixed(0),'kishi'],['Avtoturargoh talab',c.parkNeed,'joy'],['Avtoturargoh chizilgan',c.parkHave,'joy'],['Qurilish xarajati',c.cost.toFixed(0),'soʻm'],['Sotuvdan tushum',c.rev.toFixed(0),'soʻm'],[],['Binolar'],['№','Dogʻ m²','Qavat','Funksiya']];
  P.blds.forEach((b,i)=>rows.push([i+1,area(b.poly).toFixed(0),b.fl,USES[b.use][0]]));
  const csv='﻿'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=(P.name||'posadka')+'.csv';a.click();};
function planSVGm(){if(!P.site&&!P.blds.length)return null;const all=[...(P.site||[]),...P.blds.flatMap(b=>b.poly),...P.greens.flatMap(g=>g.poly),...P.parks.flatMap(g=>g.poly)].map(xy);
  const x0=Math.min(...all.map(a=>a[0]))-10,x1=Math.max(...all.map(a=>a[0]))+10,y0=Math.min(...all.map(a=>a[1]))-10,y1=Math.max(...all.map(a=>a[1]))+10,W=x1-x0,Hh=y1-y0,k=4;
  const pth=poly=>'M'+poly.map(xy).map(a=>`${((a[0]-x0)*k).toFixed(1)} ${((y1-a[1])*k).toFixed(1)}`).join('L')+'Z';
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W*k} ${Hh*k}" font-family="Archivo, sans-serif"><rect width="${W*k}" height="${Hh*k}" fill="#fff"/>`;
  (P.ctx||[]).forEach(x=>{if(x.poly.map(xy).some(q=>q[0]>x0&&q[0]<x1&&q[1]>y0&&q[1]<y1))s+=`<path d="${pth(x.poly)}" fill="#e6e4df" stroke="#9a978f" stroke-width=".8"/>`;});
  P.greens.forEach(g=>s+=`<path d="${pth(g.poly)}" fill="#cfe3c4" stroke="#6f9a5c" stroke-width="1"/>`);P.parks.forEach(g=>s+=`<path d="${pth(g.poly)}" fill="#e6e4df" stroke="#9a978f" stroke-width="1"/>`);
  if(P.site)s+=`<path d="${pth(P.site)}" fill="none" stroke="#e8775f" stroke-width="3" stroke-dasharray="14 8"/>`;
  P.blds.forEach(b=>{s+=`<path d="${pth(b.poly)}" fill="${USES[b.use][1]}" stroke="#141414" stroke-width="1.6"/>`;const c=xy(cent(b.poly));s+=`<text x="${(c[0]-x0)*k}" y="${(y1-c[1])*k+5}" font-size="14" text-anchor="middle" font-weight="600" fill="#141414">${b.fl}</text>`;});
  return {svg:s+'</svg>',mW:W,aspect:W/Hh};}
$('#toMk').onclick=async()=>{const pl=planSVGm();if(!pl){toast('Avval uchastka yoki bino chizing.');return;}const c=calc(),t=new Date().toISOString();
  const put=o=>new Promise((res,rej)=>{const r=indexedDB.open('kps_mat',1);r.onupgradeneeded=()=>r.result.createObjectStore('mats',{keyPath:'id'});r.onsuccess=()=>{const tx=r.result.transaction('mats','readwrite');tx.objectStore('mats').put(o);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);};r.onerror=()=>rej(r.error);});
  const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(pl.svg);await put({id:'pz'+Date.now().toString(36),kind:'svg',name:'Joylashtirish — bosh reja · '+(P.name||''),src,thumb:src,mW:pl.mW,aspect:pl.aspect,sub:`${f1(c.site/1e4)} ga · FAR ${f2(c.far)}`,t,legend:posLegend()});
  const rows=[['Uchastka',f2(c.site/1e4)+' ga'],['Qurilish dogʻi',fi(c.fp)+' m²'],['Qurilish ulushi',f1(c.cov)+' %'],['GFA',fi(c.gfa)+' m²'],['FAR (KPZ)',f2(c.far)],['Yashil hudud',f1(c.gr)+' %'],['Kvartiralar',fi(c.na)],['Aholi',fi(c.pop)],['Avtoturargoh talab / bor',fi(c.parkNeed)+' / '+fi(c.parkHave)]];
  const th=22,tw=420,tsvg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${tw} ${rows.length*th+30}" font-family="Archivo, sans-serif"><rect width="${tw}" height="${rows.length*th+30}" fill="#fff"/><text x="0" y="18" font-size="15" font-weight="600">Koʻrsatkichlar</text>${rows.map((r,i)=>`<line x1="0" x2="${tw}" y1="${30+i*th}" y2="${30+i*th}" stroke="#dedcd7"/><text x="0" y="${30+i*th+15}" font-size="12.5" fill="#3c3c3c">${esc(r[0])}</text><text x="${tw}" y="${30+i*th+15}" font-size="12.5" text-anchor="end" font-family="IBM Plex Mono, monospace">${esc(r[1])}</text>`).join('')}</svg>`;
  const s2='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(tsvg);await put({id:'pt'+Date.now().toString(36),kind:'svg',name:'Joylashtirish — koʻrsatkichlar jadvali',src:s2,thumb:s2,aspect:tw/(rows.length*th+30),sub:'jadval',t});
  toast('Bosh reja va jadval Albomga yuborildi.');};
$('#pName').value=P.name;$('#pName').onchange=e=>{P.name=e.target.value;save();};
renderRail();hint();HIST.a=[JSON.stringify(P)];HIST.i=0;render();if(P.site)map.fitBounds(L.polygon(P.site).getBounds(),{padding:[40,40]});
})();
