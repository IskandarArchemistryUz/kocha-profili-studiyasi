  const suns=[];for(let h=Math.max(3,t0);h<=Math.min(21,t1);h+=step){const s=sunPos(D,h,lat);if(s.alt>0)suns.push({h,alt:s.alt,u:[Math.sin(s.az),Math.cos(s.az)],ta:Math.tan(s.alt)});}
  P.blds.forEach((b,bi)=>{if(b.use!=='res')return;const Mp=M[bi];let sa=0;for(let i=0;i<Mp.length;i++){const j=(i+1)%Mp.length;sa+=Mp[i][0]*Mp[j][1]-Mp[j][0]*Mp[i][1];}const ccw=sa>0;
    const z=(b.gf&&b.gf!=='res'&&b.fl>1?P.p.fh:0)+(+n.wz||0);
    for(let e=0;e<Mp.length;e++){const a=Mp[e],c=Mp[(e+1)%Mp.length],ex=c[0]-a[0],ey=c[1]-a[1],Le=Math.hypot(ex,ey);if(Le<2)continue;const nx=(ccw?ey:-ey)/Le,ny=(ccw?-ex:ex)/Le;
      const k=Math.max(1,Math.round(Le/(+n.step||6)));for(let s=0;s<k;s++){const f=(s+.5)/k,p=[a[0]+ex*f+nx*.15,a[1]+ey*f+ny*.15];let run=0,best=0,tot=0,st0=null,bs=null,be=null;
        suns.forEach((S,si)=>{let lit=S.u[0]*nx+S.u[1]*ny>0;if(lit)for(let o=0;o<OB.length;o++){const t=rayHit(p,S.u,OB[o][0]);if(t<Infinity&&z+t*S.ta<OB[o][1]){lit=false;break;}}
          if(lit){if(!run)st0=S.h;run+=step;tot+=step;if(run>best){best=run;bs=st0;be=S.h+step;}}else run=0;});
        out.push({bi,p,best,tot,bs,be});}}});
  return out;}

  const rows=[['Uchastka',f2(c.site/1e4)+' ga'],['Qurilish dogʻi',fi(c.fp)+' m²'],['Qurilish ulushi',f1(c.cov)+' %'],['GFA',fi(c.gfa)+' m²'],['FAR (KPZ)',f2(c.far)],['Yashil hudud',f1(c.gr)+' %'],['Kvartiralar',fi(c.na)],['Aholi',fi(c.pop)],['Avtoturargoh talab / bor',fi(c.parkNeed)+' / '+fi(c.parkHave)]];
  const th=22,tw=420,tsvg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${tw} ${rows.length*th+30}" font-family="Archivo, sans-serif"><rect width="${tw}" height="${rows.length*th+30}" fill="#fff"/><text x="0" y="18" font-size="15" font-weight="600">Koʻrsatkichlar</text>${rows.map((r,i)=>`<line x1="0" x2="${tw}" y1="${30+i*th}" y2="${30+i*th}" stroke="#dedcd7"/><text x="0" y="${30+i*th+15}" font-size="12.5" fill="#3c3c3c">${esc(r[0])}</text><text x="${tw}" y="${30+i*th+15}" font-size="12.5" text-anchor="end" font-family="IBM Plex Mono, monospace">${esc(r[1])}</text>`).join('')}</svg>`;
  const s2='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(tsvg);await put({id:'pt'+Date.now().toString(36),kind:'svg',name:'Joylashtirish — koʻrsatkichlar jadvali',src:s2,thumb:s2,aspect:tw/(rows.length*th+30),sub:'jadval',t});
  toast('Bosh reja va jadval Albomga yuborildi.');};

/* ---- fasad modullari (3D uchun) ---- */
function facUI(b){const M=window.M3D_LIB;if(!M)return '';const F=Object.assign({},M.STYLES[P.p.fac0||'tsh'][1],b.fac||{}),st=(b.fac&&b.fac.style)||P.p.fac0||'tsh';
  const sel=(k,lib,lbl)=>`<label>${lbl}<select data-fac="${k}">${Object.entries(lib).map(([v,o])=>`<option value="${v}" ${F[k]===v?'selected':''}>${o[0]}</option>`).join('')}</select></label>`;
  const tips=[F.shade,F.bal,F.gf,F.roof,F.wall,F.win].map(k=>M.TIPS[k]).filter(Boolean);
  return `<details class="facd" ${window.__facOpen?'open':''}><summary>Fasad va modullar (3D)</summary><div class="f" style="margin-top:6px"><label class="full">Uslub (tayyor toʻplam)<select id="fStyle">${Object.entries(M.STYLES).map(([k,v])=>`<option value="${k}" ${st===k?'selected':''}>${v[0]}</option>`).join('')}</select></label>
    ${sel('wall',M.LIB.wall,'Devor')}${sel('win',M.LIB.win,'Deraza')}${sel('bal',M.LIB.bal,'Balkon')}<label>Balkon har N qavatda<input type="number" min="1" max="6" data-facn="balN" value="${F.balN||1}"></label>
    ${sel('shade',M.LIB.shade,'Quyoshdan himoya')}${sel('gf',M.LIB.gf,'1-qavat')}${sel('roof',M.LIB.roof,'Tom')}<label>Deraza qadami, m<input type="number" step="0.1" min="1" max="12" data-facn="pitch" value="${F.pitch}"></label></div>
    ${tips.length?`<div class="note" style="margin-top:6px">${tips.map(t=>'• '+t).join('<br>')}</div>`:''}<div style="display:flex;gap:6px;margin-top:6px"><button class="btn sm ghost" id="fAll">Barcha binolarga</button><button class="btn sm ghost" id="fDef">Loyiha uchun asosiy</button></div></details>`;}
function bindFac(b){const M=window.M3D_LIB;if(!M||!$('#fStyle'))return;document.querySelector('.facd').addEventListener('toggle',e=>{window.__facOpen=e.target.open;});
  $('#fStyle').onchange=e=>{b.fac=Object.assign({style:e.target.value},M.STYLES[e.target.value][1]);commit();};
  document.querySelectorAll('[data-fac]').forEach(i=>i.onchange=()=>{b.fac=Object.assign({},M.STYLES[(b.fac&&b.fac.style)||P.p.fac0||'tsh'][1],b.fac||{},{[i.dataset.fac]:i.value});commit();});
  document.querySelectorAll('[data-facn]').forEach(i=>i.onchange=()=>{b.fac=Object.assign({},M.STYLES[(b.fac&&b.fac.style)||P.p.fac0||'tsh'][1],b.fac||{},{[i.dataset.facn]:+i.value});commit();});
  $('#fAll').onclick=()=>{P.blds.forEach(x=>{x.fac=JSON.parse(JSON.stringify(b.fac||{}));});commit();toast('Fasad barcha binolarga qoʻllandi.');};
  $('#fDef').onclick=()=>{P.p.fac0=(b.fac&&b.fac.style)||'tsh';commit();toast('Yangi binolar shu uslubda boʻladi.');};}
const putMat=o=>new Promise((res,rej)=>{const r=indexedDB.open('kps_mat',1);r.onupgradeneeded=()=>r.result.createObjectStore('mats',{keyPath:'id'});r.onsuccess=()=>{const tx=r.result.transaction('mats','readwrite');tx.objectStore('mats').put(o);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);};r.onerror=()=>rej(r.error);});
/* Loyiha rejimi: 1-qadamdagi hudud chegarasi maʼlumot uchun koʻrsatiladi (uchastka chegarasi oʻzgarmaydi). */
(function(){
  if(!document.documentElement.classList.contains('kps-embed')) return;
  let lay=null;
  function apply(fit){
    let s=null;try{s=JSON.parse(localStorage.getItem('kps_site')||'null');}catch(e){}
    if(lay){map.removeLayer(lay);lay=null;}
    if(!s||!s.ring||s.ring.length<3) return;
    lay=L.polygon(s.ring,{color:'#7b61d1',weight:1.5,dashArray:'6 5',fill:false,interactive:false}).addTo(map);
    // uchastka yoʻq yoki u boshqa joyda (hududdan tashqarida) boʻlsa — xarita loyiha hududiga
    const inside=()=>{ if(!(P.site&&P.site.length)) return false; const b=lay.getBounds(); return P.site.some(q=>b.contains(L.latLng(q[0],q[1]))); };
    if(fit&&!inside()) try{map.fitBounds(lay.getBounds().pad(.05));}catch(e){}
  }
  // 1-qadamda chizilgan uchastka chegarasi — shu yerdagi uchastka boʻladi (oʻzingiz chizmagan boʻlsangiz)
  function takeSite(){ let a=[]; try{ a=JSON.parse(localStorage.getItem('kps_ai_sites')||'[]'); }catch(e){}
    if(!a.length||!a[0].pts||a[0].pts.length<3) return false;
    const pts=a[0].pts.map(p=>[+p[0],+p[1]]), same=P.site&&JSON.stringify(P.site)===JSON.stringify(pts);
    if(same) return false;
    if(P.site&&P.site.length&&P._siteSrc!=='step1') return false;   // oʻzi chizgan uchastkani almashtirmaymiz
    P.site=pts; P._siteSrc='step1'; commit(); try{ map.fitBounds(L.latLngBounds(pts).pad(.25)); }catch(e){} return true; }
  apply(!takeSite());
  window.addEventListener('storage',e=>{ if(e.key==='kps_site') apply(true); if(e.key==='kps_ai_sites') takeSite(); });
  // izolyatsiya: hududdan tashqarisi oqartiriladi (1-qadamdagi «Faqat hudud ichi» bilan bir xil)
  let mask=null;
  function drawIso(){ if(mask){ map.removeLayer(mask); mask=null; } let s=null; try{ s=JSON.parse(localStorage.getItem('kps_site')||'null'); }catch(e){}
    if(localStorage.getItem('kps_ai_clip')!=='1'||!s||!s.ring) return;
    mask=L.polygon([[[85,-180],[85,180],[-85,180],[-85,-180]],s.ring],{stroke:false,fillColor:'#f4f3f1',fillOpacity:.86,interactive:false}).addTo(map); }
  drawIso(); window.addEventListener('storage',e=>{ if(e.key==='kps_ai_clip'||e.key==='kps_site') drawIso(); });
})();
/* shamol: 1-qadamdagi shamol guli xaritada (bino joylashuvini tanlashda) va shamol taʼsiri tahliliga havola */
(function(){const WN=['Sh','ShShQ','ShQ','ShQQ','Q','JShQ','JQ','JJQ','J','JJGʻ','JGʻ','JGʻGʻ','Gʻ','ShGʻGʻ','ShGʻ','ShShGʻ'];
  const Ctl=L.Control.extend({options:{position:'bottomleft'},onAdd(){const d=L.DomUtil.create('div');d.id='pzWind';d.style.cssText='background:#fff;border:1px solid #141414;padding:8px 10px;font:12px/1.45 "IBM Plex Sans",sans-serif;max-width:230px';L.DomEvent.disableClickPropagation(d);return d;}});
  map.addControl(new Ctl());
  function draw(){const d=document.getElementById('pzWind');if(!d)return;let w=null;try{w=JSON.parse(localStorage.getItem('kps_wind_rose')||'null');}catch(e){}
    const link='<a href="shamol.html#bino" style="display:inline-block;margin-top:5px;color:#141414;font-weight:600">Binolarning shamolga taʼsiri →</a>';
    if(!w||!w.yil){d.innerHTML='<b>Shamol</b><br><span style="color:#696969">Shamol guli 1-qadamda «Hisoblash» dan keyin chiqadi.</span><br>'+link;return;}
    const f=w.yil.freq,c=34,R=30,mx=Math.max(...f,.01);let s='<svg width="68" height="68" viewBox="0 0 68 68" style="float:left;margin-right:8px">';
    f.forEach((v,i)=>{const a0=(i*22.5-9)*Math.PI/180,a1=(i*22.5+9)*Math.PI/180,r=3+(R-3)*v/mx;s+=`<path d="M${c} ${c}L${(c+Math.sin(a0)*r).toFixed(1)} ${(c-Math.cos(a0)*r).toFixed(1)}L${(c+Math.sin(a1)*r).toFixed(1)} ${(c-Math.cos(a1)*r).toFixed(1)}Z" fill="${v===mx?'#1d6fa5':'#9fbdd1'}"/>`;});
    s+=`<text x="${c}" y="9" text-anchor="middle" font-size="9" fill="#b3261e">Sh</text></svg>`;const t=f.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]);
    d.innerHTML=s+`<b>Shamol</b> (ERA5)<br>Asosiy: ${WN[t[0][1]]} ${Math.round(t[0][0]*100)} %<br>Ikkinchi: ${WN[t[1][1]]} ${Math.round(t[1][0]*100)} %<br>Shtil: ${Math.round(w.yil.calm*100)} %<div style="clear:both"></div>`+link;}
  draw();window.addEventListener('storage',e=>{if(e.key==='kps_wind_rose')draw();});})();
window.PZ={P:()=>P,xy,ll,lat0,center:()=>{const c=map.getCenter();return [c.lat,c.lng];},toast,sunPos,doy,N,uid,USES,sel:()=>sel,setSel:id=>{sel=id?{t:'b',id}:null;renderSide();},commit,delSel,loadCtx,putMat,openPlan,refresh:()=>renderSide()};
})();
