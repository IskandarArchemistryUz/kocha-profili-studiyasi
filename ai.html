  ${F.project_buildings?`<div class="met"><span>Loyiha binolaridan (Joylashtirish, ${F.project_buildings.n} ta) eng uzoq masofa</span><b>${F.project_buildings.max_to_kindergarten_m!=null?fi(F.project_buildings.max_to_kindergarten_m)+' m':'—'} · ${F.project_buildings.max_to_school_m!=null?fi(F.project_buildings.max_to_school_m)+' m':'—'} · ${F.project_buildings.max_to_stop_m!=null?fi(F.project_buildings.max_to_stop_m)+' m':'—'}</b><small>bogʻcha · maktab · bekat — turar joy binolari, tarmoq boʻyicha</small></div>`:''}${F.pedshed_10min_ratio!=null?`<div class="met"><span>Piyoda qamrovi (10 daq.): tarmoq / doira</span><b>${f2(F.pedshed_10min_ratio)}</b><small>1 ga yaqin — toʻr yaxshi ulangan</small></div>`:''}
  <div style="display:grid;grid-template-columns:1fr 46px 46px 46px 50px;gap:2px 6px;font-size:13px;margin-top:8px;align-items:center"><span class="note">EHTIYOJ</span><span class="note">≤5′</span><span class="note">≤10′</span><span class="note">≤15′</span><span class="note">MED.</span>`;
  C15.forEach(([c,n,col])=>{const x=F.categories[n];h+=`<button data-c15="${c}" style="border:0;background:${cat15===c?'#efede9':'none'};text-align:left;padding:3px 4px;display:flex;gap:6px;align-items:center;font-size:13px"><i style="width:9px;height:9px;background:${col};flex:none"></i>${n} <span class="note">(${x.count})</span></button><b style="font-family:var(--mono);font-weight:500">${f1(x.within_5min_pct)}</b><b style="font-family:var(--mono);font-weight:500">${f1(x.within_10min_pct)}</b><b style="font-family:var(--mono);font-weight:500;color:${x.within_15min_pct>=80?'var(--ok)':x.within_15min_pct<50?'var(--bad)':'inherit'}">${f1(x.within_15min_pct)}</b><b style="font-family:var(--mono);font-weight:400">${x.median_min!=null?f1(x.median_min)+'′':'—'}</b>`;});
  h+=`</div><div style="display:flex;gap:6px;margin-top:6px;align-items:center"><button class="btn sm ${cat15==='all'?'dark':'ghost'}" data-c15="all" style="height:24px;font-size:11.5px">Hammasi</button><span class="note">${cat15==='all'?'Rang: nechta tur 15 daqiqada (qizil 0 → yashil hammasi)':'Rang: ≤5′ · ≤10′ · ≤15′ · ≤25′ · undan koʻp'}</span></div>
  <div class="note">% — hudud kataklari (${F.cell_size_m} m) ulushi; ${F.cells} katak. Qatorni bosing — xaritada shu ehtiyoj boʻyicha qamrov.</div></div>`;return h;}
function secNodes(){const n=res.transport_nodes_straight_km;if(!n)return '';const r=(l,x)=>`<div class="met"><span>${l}${x&&x.name?` <span class="note">(${esc(x.name)})</span>`:''}</span><b>${x?f2(x.km)+' km':'—'}</b></div>`;
  return `<div><div class="lbl">Transport tugunlari · toʻgʻri chiziq boʻyicha</div>${r('Eng yaqin metro',n.metro)}${r('Temir yoʻl vokzali',n.railway_station)}${r('Aeroport',n.airport)}<div class="met"><span>Mehnat joylari zichligi (ofis, savdo, xizmat POI)</span><b>${f1(res.jobs_poi_per_km2)} /km²</b><small>OSM boʻyicha taxminiy koʻrsatkich</small></div></div>`;}
function secDens(){if(res.gross_floor_area_ratio_FAR==null)return '';return `<div><div class="lbl">Zichlik · OSM binolari</div><div class="met"><span>Binolar soni · qoplam</span><b>${fi(res.buildings)} · ${f1(res.building_coverage_pct)} %</b></div><div class="met"><span>Brutto qavatlar maydoni koeff. (FAR)</span><b>${f2(res.gross_floor_area_ratio_FAR)}</b><small>qavatlar soni tegi bor: ${f1(res.levels_tagged_share_pct)} % binolar</small></div>
  <div class="met"><span>Turar joy qavatlar maydoni</span><b>${fi(res.residential_floor_area_m2/1000)} ming m²</b></div>${res.population_estimate!=null?`<div class="met"><span>Taxminiy aholi · zichlik</span><b>${fi(res.population_estimate)} · ${fi(res.population_density_per_ha)} kishi/ga</b><small>${PRM.mpp} m²/kishi boʻyicha</small></div>`:'<div class="note">Aholini baholash uchun parametrlarda «m² / kishi» ni kiriting.</div>'}</div>`;}
function bind15(){document.querySelectorAll('[data-c15]').forEach(b=>b.onclick=()=>{cat15=b.dataset.c15;draw15();renderRes();});bindPrm();}
function renderRes(){if(!res){$('#body').innerHTML=`<div><h2>Hudud bahosi</h2><div class="sub">Radius yoki chegara tanlang → «Hisoblash». Koʻrsatkichlar OSM dan brauzerda hisoblanadi; AI ularga tayanib xulosa yozadi.</div></div>${prmBox()}${keyBox()}`;bindKey();bindPrm();return;}
  let h=`<div><h2>Hudud bahosi</h2><div class="sub">${esc(res.mode)} · ${f2(res.area_km2)} km²</div></div><div><div class="lbl">Hisoblangan · OpenStreetMap</div>`;
  MET.forEach(([n,k,u,mx,col,d])=>{const v=res[k];if(v==null)return;h+=`<div class="met"><span>${n}</span><b>${typeof v==='number'?f1(v):v} ${u}</b><i><s style="width:${Math.min(100,v/mx*100)}%;background:${col}"></s></i><small>${d}</small></div>`;});
  h+=`<div class="met"><span>Bekatlar · chorrahalar · xizmatlar</span><b>${res.transit_stops} · ${res.intersections} · ${res.services_poi}</b></div><div class="met"><span>Maktab · bogʻcha · sogʻliqni saqlash</span><b>${res.social.school} · ${res.social.kindergarten} · ${res.social.health}</b></div></div>
    ${sec15()}${secNodes()}${secDens()}<div class="note">${res.notes.map(esc).join('<br>')}</div>`;
  h+=`<div><div class="lbl" style="color:var(--ai)">AI xulosasi · qoralama, tekshiring</div><div class="ai" id="aiOut">${aiText?md(aiText):(KEY()?'<span class="note">Yuqoridagi soʻrovni yuboring (↑) yoki tugmalardan birini tanlang.</span>':'')}</div></div>${KEY()?'':keyBox()}
    ${prmBox()}<div class="chips"><button id="toMk">Albomga →</button><button id="cpJ">JSON nusxa</button></div>`;
  $('#body').innerHTML=h;bindKey();bind15();
  $('#toMk').onclick=toMaket;$('#cpJ').onclick=()=>{navigator.clipboard.writeText(JSON.stringify(res,null,2));toast('Koʻrsatkichlar nusxalandi.');};}
function keyBox(){return `<div class="keybox"><b>AI xulosasi uchun Anthropic API kaliti</b><span class="note">Sayt serversiz ishlaydi: soʻrov brauzeringizdan toʻgʻridan-toʻgʻri Anthropic API ga ketadi. Kalit faqat shu brauzerda saqlanadi; har soʻrov kalit egasining hisobidan toʻlanadi. Kalit: console.anthropic.com → API Keys.</span>
  <input type="password" id="kIn" placeholder="sk-ant-..." value="${esc(KEY())}"><select id="kMod"><option value="${esc(MODEL())}">${esc(MODEL())}</option></select><div style="display:flex;gap:6px"><button class="btn sm dark" id="kSave">Saqlash</button><button class="btn sm ghost" id="kDel">Oʻchirish</button></div></div>`;}
function bindKey(){if(!$('#kSave'))return;$('#kSave').onclick=async()=>{localStorage.setItem('kps_ai_key',$('#kIn').value.trim());localStorage.setItem('kps_ai_model',$('#kMod').value);await loadModels();toast('Kalit saqlandi.');renderRes();};
  $('#kDel').onclick=()=>{localStorage.removeItem('kps_ai_key');toast('Kalit oʻchirildi.');renderRes();};loadModels();}
async function loadModels(){const k=KEY();if(!k||!$('#kMod'))return;try{const r=await fetch('https://api.anthropic.com/v1/models?limit=50',{headers:{'x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}});if(!r.ok)return;const j=await r.json();const ids=(j.data||[]).map(m=>m.id);if(ids.length)$('#kMod').innerHTML=ids.map(i=>`<option ${i===MODEL()?'selected':''}>${esc(i)}</option>`).join('');}catch(e){}}
$('#keyBtn').onclick=()=>{res=res||null;renderRes();const k=document.querySelector('.keybox');if(!k){$('#body').insertAdjacentHTML('beforeend',keyBox());bindKey();}document.querySelector('.keybox').scrollIntoView({behavior:'smooth'});};
async function ask(q){if(!res){toast('Avval hududni hisoblang.');return;}if(!KEY()){toast('AI kalitini kiriting.');$('#keyBtn').click();return;}
  const out=$('#aiOut');out.innerHTML='<span class="note">AI yozmoqda…</span>';
  const sys="Siz Oʻzbekiston va Markaziy Osiyo shaharlarini yaxshi biladigan urbanist-ekspertsiz. Javobni oʻzbek tilida (lotin), qisqa va tuzilgan holda bering: ## Umumiy baho, ## Kuchli tomonlar, ## Zaif tomonlar, ## Tavsiyalar. Faqat foydalanuvchi bergan JSON koʻrsatkichlarga tayaning; yangi raqam, norma bandi yoki manba oʻylab topmang. Normaga ishora kerak boʻlsa, «tegishli me'yor bilan tekshirish kerak» deb yozing. OSM maʼlumotlari toʻliq boʻlmasligi mumkinligini hisobga oling va qaysi xulosa joyida tekshirishni talab qilishini ayting. Xalqaro taqqoslashlarni faqat umumiy tamoyil sifatida keltiring.";
  try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':KEY(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:MODEL(),max_tokens:1800,system:sys+(window.KPS_LANG==='ru'?' Отвечай на русском языке.':window.KPS_LANG==='en'?' Answer in English.':''),messages:[{role:'user',content:`Hudud koʻrsatkichlari (JSON):\n${JSON.stringify(res,null,1)}\n\nSoʻrov: ${q}`}]})});
    const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));aiText=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');out.innerHTML=md(aiText);}
  catch(e){out.innerHTML=`<span class="note" style="color:var(--bad)">AI javob bermadi: ${esc(e.message)}</span>`;}}
$('#askBtn').onclick=()=>ask($('#q').value);document.querySelectorAll('[data-qq]').forEach(b=>b.onclick=()=>{$('#q').value=b.dataset.qq;ask(b.dataset.qq);});
$('#runBtn').onclick=compute;
async function toMaket(){const put=o=>new Promise((ok,no)=>{const r=indexedDB.open('kps_mat',1);r.onupgradeneeded=()=>r.result.createObjectStore('mats',{keyPath:'id'});r.onsuccess=()=>{const t=r.result.transaction('mats','readwrite');t.objectStore('mats').put(o);t.oncomplete=ok;t.onerror=()=>no(t.error);};r.onerror=()=>no(r.error);});
  const rows=MET.filter(m=>res[m[1]]!=null).map(m=>[m[0],f1(res[m[1]])+' '+m[2]]),tw=460,th=22,H=rows.length*th+34,t=new Date().toISOString();
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${tw} ${H}" font-family="Archivo, sans-serif"><rect width="${tw}" height="${H}" fill="#fff"/><text x="0" y="18" font-size="15" font-weight="600">Hudud koʻrsatkichlari · ${esc(res.mode)}</text>${rows.map((r,i)=>`<line x1="0" x2="${tw}" y1="${32+i*th}" y2="${32+i*th}" stroke="#dedcd7"/><text x="0" y="${32+i*th+15}" font-size="12.5" fill="#3c3c3c">${esc(r[0])}</text><text x="${tw}" y="${32+i*th+15}" font-size="12.5" text-anchor="end" font-family="IBM Plex Mono, monospace">${esc(r[1])}</text>`).join('')}</svg>`;
  const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);await put({id:'ai'+Date.now().toString(36),kind:'svg',name:'Hudud koʻrsatkichlari',src,thumb:src,aspect:tw/H,sub:res.mode,t});
  if(aiText){const lines=[];aiText.replace(/\*\*/g,'').split('\n').forEach(l=>{l=l.replace(/^#+\s*/,'').replace(/^[-*]\s+/,'— ');while(l.length>78){let k=l.lastIndexOf(' ',78);if(k<20)k=78;lines.push(l.slice(0,k));l=l.slice(k+1);}lines.push(l);});
    const lh=17,H2=lines.length*lh+20,s2=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${tw} ${H2}" font-family="Archivo, sans-serif"><rect width="${tw}" height="${H2}" fill="#fff"/>${lines.map((l,i)=>`<text x="0" y="${16+i*lh}" font-size="12">${esc(l)}</text>`).join('')}</svg>`;
    const src2='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s2);await put({id:'aiT'+Date.now().toString(36),kind:'svg',name:'AI xulosasi',src:src2,thumb:src2,aspect:tw/H2,sub:'matn',t});}
  if(LAST15&&LAST15.cells.length){const F2=LAST15,N=C15.length,P=F2.cells.map(c=>[c.p[1]*MX,c.p[0]*MY]),R2=F2.ring.map(p=>[p[1]*MX,p[0]*MY]),all=P.concat(R2),x0=Math.min(...all.map(a=>a[0]))-F2.step,x1=Math.max(...all.map(a=>a[0]))+F2.step,y0=Math.min(...all.map(a=>a[1]))-F2.step,y1=Math.max(...all.map(a=>a[1]))+F2.step,k=1000/(x1-x0),Wd=1000,Hd=(y1-y0)*k,cs=F2.step*k;
    let s4=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${Wd} ${Hd.toFixed(0)}"><rect width="${Wd}" height="${Hd.toFixed(0)}" fill="#fff"/>`;F2.cells.forEach((c,i)=>{const q=P[i],col=c.n==null?'#e6e4df':`hsl(${c.n/N*130},62%,${42+c.n/N*8}%)`;s4+=`<rect x="${((q[0]-x0)*k-cs/2).toFixed(1)}" y="${((y1-q[1])*k-cs/2).toFixed(1)}" width="${(cs+.5).toFixed(1)}" height="${(cs+.5).toFixed(1)}" fill="${col}" fill-opacity=".8"/>`;});
    s4+=`<path d="M${R2.map(q=>`${((q[0]-x0)*k).toFixed(1)} ${((y1-q[1])*k).toFixed(1)}`).join('L')}Z" fill="none" stroke="#141414" stroke-width="2" stroke-dasharray="8 5"/></svg>`;const src4='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s4);
    await put({id:'a15m'+Date.now().toString(36),kind:'svg',name:'15 daqiqalik shahar — xarita',src:src4,thumb:src4,mW:x1-x0,aspect:Wd/Hd,sub:res.mode,t,legend:[0,3,6,9].map(v=>({col:`hsl(${v/N*130},62%,${42+v/N*8}%)`,label:v+' tur 15 daqiqada',kind:'fill',on:true})).concat([{col:'#e6e4df',label:'Tarmoqdan uzoq',kind:'fill',on:true}])});}
  if(res.fifteen_min){const F=res.fifteen_min,rw=C15.map(([c,n])=>[n,F.categories[n]]),th2=22,H3=rw.length*th2+56,s3=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${tw} ${H3}" font-family="Archivo, sans-serif"><rect width="${tw}" height="${H3}" fill="#fff"/><text x="0" y="18" font-size="15" font-weight="600">15 daqiqalik shahar · ${F.speed_kmh} km/soat</text><text x="250" y="44" font-size="10" fill="#696969">≤5′</text><text x="310" y="44" font-size="10" fill="#696969">≤10′</text><text x="370" y="44" font-size="10" fill="#696969">≤15′</text><text x="${tw}" y="44" font-size="10" fill="#696969" text-anchor="end">med.</text>${rw.map(([n,x],i)=>`<line x1="0" x2="${tw}" y1="${50+i*th2}" y2="${50+i*th2}" stroke="#dedcd7"/><text x="0" y="${50+i*th2+15}" font-size="12" fill="#3c3c3c">${esc(n)}</text>${[x.within_5min_pct,x.within_10min_pct,x.within_15min_pct].map((v,j)=>`<text x="${250+j*60}" y="${50+i*th2+15}" font-size="12" font-family="IBM Plex Mono, monospace">${f1(v)}%</text>`).join('')}<text x="${tw}" y="${50+i*th2+15}" font-size="12" text-anchor="end" font-family="IBM Plex Mono, monospace">${x.median_min!=null?f1(x.median_min)+'′':'—'}</text>`).join('')}</svg>`;
    const src3='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s3);await put({id:'a15'+Date.now().toString(36),kind:'svg',name:'15 daqiqalik shahar — jadval',src:src3,thumb:src3,aspect:tw/H3,sub:res.mode,t,legend:C15.map(([c,n,col])=>({col,label:n,kind:'fill',on:true}))});}
  toast('Albomga yuborildi.');}
$('#l15').onchange=()=>draw15();$('#lIso').onchange=()=>draw15();$('#lPoi').onchange=e=>{if(e.target.checked)O.addTo(map);else map.removeLayer(O);};
if(window.KPS_LANG&&window.KPS_LANG!=='uz'){const q=$('#q');q.value=window.kpsT(q.value);}
hint();renderRes();
})();
</script>
<script src="js/i18n.js?v=9"></script>
