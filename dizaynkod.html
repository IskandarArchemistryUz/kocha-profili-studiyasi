<style>
/* Layout: ustada 4 qadamli yo'l; chapda katta rasm, o'ngda faqat joriy qadamning bitta kartasi */
:root{
  --bg:#f4f3f1; --surface:#FFFFFF; --sunk:#ecebe7; --fg:#141414; --muted:#696969; --line:#dedcd7;
  --accent:#141414; --accent-soft:#ecebe7; --on-accent:#f4f3f1;
  --ok:#25744A; --ok-soft:#DDF0E4; --warn:#8A5A00; --warn-soft:#F7EACB; --bad:#B3261E; --bad-soft:#F9E1DE;
  --f-ui:Archivo,"Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-ui);margin:0}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;margin-bottom:14px}
.top h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
.top .src{font:12px var(--f-mono);color:var(--muted)}
ol.steps{list-style:none;display:flex;gap:6px;padding:0;margin:0 0 14px;flex-wrap:wrap}
ol.steps button{display:flex;align-items:center;gap:8px;font:500 14px var(--f-ui);background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:2px;padding:6px 14px 6px 6px;cursor:pointer}
ol.steps .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);font:600 12px var(--f-mono)}
ol.steps button[aria-current="step"]{color:var(--fg);border-color:var(--accent)}
ol.steps button[aria-current="step"] .n{background:var(--accent);color:var(--on-accent)}
ol.steps button.done .n{background:var(--ok-soft);color:var(--ok)}
ol.steps button:disabled{cursor:not-allowed;opacity:.55}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:stretch;height:640px}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr);height:auto!important}.stage{height:62vh}.card{max-height:none}}
.stage{background:var(--sunk);border-radius:2px;overflow:hidden;position:relative;min-height:0;height:100%}
canvas#cv{display:block;width:100%;height:100%;touch-action:none;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;overflow:auto;min-height:0}
.card h3.sec{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px;padding-top:10px;border-top:1px solid var(--line)}
.hintbar{position:absolute;left:34px;top:30px;font:12.5px var(--f-ui);color:var(--fg);background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:3px;padding:4px 9px;pointer-events:none}
.card h2{font-size:18px;font-weight:600}
.lead{color:var(--muted);font-size:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 120px;min-width:0}
input[type=number],input[type=text],select{font:15px var(--f-ui);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:8px 10px;width:100%}
input[type=number]{font-family:var(--f-mono)}
input[type=range]{width:100%;accent-color:var(--accent)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:500 14px var(--f-ui);border-radius:2px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
.nav{display:flex;gap:8px;justify-content:space-between;padding-top:4px;border-top:1px solid var(--line)}
.nav .primary{margin-left:auto}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.chk input{margin-top:4px}
.drop{border:2px dashed var(--line);border-radius:2px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.drop b{color:var(--fg)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.types button{text-align:left;font-size:13px;padding:8px;line-height:1.3}
.row button[aria-pressed="true"],.types button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.types small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.verdict{border-radius:2px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.verdict b{font-size:16px}
.v-bad{background:var(--bad-soft);color:var(--bad)} .v-warn{background:var(--warn-soft);color:var(--warn)} .v-ok{background:var(--ok-soft);color:var(--ok)}
.prob{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:2px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.prob.warn{border-left-color:var(--warn)}
.prob .t{font-weight:600;font-size:14px}
.prob .m{font-size:13px;color:var(--muted)}
.prob .src{font:11px var(--f-mono);color:var(--muted)}
.prob button{align-self:flex-start;padding:5px 10px;font-size:13px}
details.more{font-size:13px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:500}
details.more .inner{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.mini{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line)}
.mini .s{font:500 11px var(--f-mono);padding:1px 6px;border-radius:3px;white-space:nowrap}
.s-ok{background:var(--ok-soft);color:var(--ok)} .s-warn{background:var(--warn-soft);color:var(--warn)} .s-bad{background:var(--bad-soft);color:var(--bad)} .s-pend{background:var(--sunk);color:var(--muted)}
.mini label{display:flex;gap:6px;align-items:flex-start}
.dims{font:13px var(--f-mono);color:var(--fg);background:var(--bg);border-radius:2px;padding:8px 10px}
.sample{position:absolute;bottom:10px;left:10px;font:12px var(--f-mono);background:var(--warn-soft);color:var(--warn);padding:3px 8px;border-radius:2px}
#sum,#groups{display:none}
.zoombar{position:absolute;bottom:10px;right:10px;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.zoombar button{border:0;padding:4px 10px;font:600 15px var(--f-ui);background:transparent}
.zoombar button:hover{background:var(--sunk)}
.zoombar span{font:12px var(--f-mono);min-width:46px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

a{color:inherit;text-decoration:none}
header.kps{height:52px;display:flex;align-items:center;gap:20px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--bg)}
header.kps .brand{display:flex;align-items:center;gap:10px}
header.kps .brand b{font-weight:500;font-size:14.5px;letter-spacing:.2em}
header.kps .brand i{font-style:normal;font-size:12.5px;letter-spacing:.18em;color:var(--muted)}
header.kps .crumb{font-size:12.5px;letter-spacing:.14em;color:var(--muted)}
header.kps .sp{flex:1}
header.kps .hb{height:30px;padding:0 12px;border:1px solid var(--fg);border-radius:2px;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;display:inline-flex;align-items:center}
.page{padding:16px 18px 40px}
.top h1{font-weight:500;font-size:24px;letter-spacing:-.01em}
ol.steps button{text-transform:uppercase;letter-spacing:.12em;font-size:12.5px}
button.primary{text-transform:uppercase;letter-spacing:.1em;font-size:13px}
@media (max-width:560px){header.kps{padding:0 16px;gap:12px}header.kps .brand i,header.kps .crumb{display:none}.page{padding:12px 16px 32px}}
</style>

/* ---------- gomografiya ---------- */
function solve(A,b){const n=b.length;for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;[A[i],A[p]]=[A[p],A[i]];[b[i],b[p]]=[b[p],b[i]];for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i];}}const x=new Array(n);for(let i=n-1;i>=0;i--){let s=b[i];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=s/A[i][i];}return x;}
function homography(src,dst){const A=[],b=[];for(let i=0;i<4;i++){const[x,y]=src[i],[u,v]=dst[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v);}const h=solve(A,b);return[h[0],h[1],h[2],h[3],h[4],h[5],h[6],h[7],1];}
function apply(H,x,y){const w=H[6]*x+H[7]*y+H[8];return[(H[0]*x+H[1]*y+H[2])/w,(H[3]*x+H[4]*y+H[5])/w];}

function warp(srcC,dstC,Hdst2src){
  const sg=srcC.getContext('2d').getImageData(0,0,srcC.width,srcC.height), sd=sg.data, sw=srcC.width, sh=srcC.height;
  const dg=dstC.getContext('2d'), out=dg.createImageData(dstC.width,dstC.height), od=out.data;
  for(let y=0;y<dstC.height;y++)for(let x=0;x<dstC.width;x++){const[u,v]=apply(Hdst2src,x,y);const i=(y*dstC.width+x)*4;
    if(u>=0&&v>=0&&u<sw-1&&v<sh-1){const x0=u|0,y0=v|0,fx=u-x0,fy=v-y0,j=(y0*sw+x0)*4,j2=j+sw*4;
      for(let c=0;c<4;c++){const a=sd[j+c]+(sd[j+4+c]-sd[j+c])*fx,b=sd[j2+c]+(sd[j2+4+c]-sd[j2+c])*fx;od[i+c]=a+(b-a)*fy;}}else{od[i+3]=0;}}
  dg.putImageData(out,0,0);
}

const CAP=0.70;
function textW(t,letterH){if(!t)return 0;mctx.font=`600 100px "IBM Plex Sans", sans-serif`;return mctx.measureText(t.toUpperCase()).width/100*(letterH/CAP);}
function layout(sg){
  if(sg.mode==="panel"){sg.w=sg.pw;sg.h=sg.ph;return;}
  if(sg.mode==="logo"&&sg.logo){sg.w=sg.logoW;sg.h=sg.logoW*sg.logo.height/sg.logo.width;sg.uzW=1;sg.altW=0;return;}
  const L=sg.letterH, gap=sg.alt?L*0.9:0;

}

/* ---------- qoidalarni tanlash (meros bilan) ---------- */
function rulesFor(type,tip){
  const own=RULES.filter(r=>r.viveska_turi===type);
  const byParam={};
  for(const r of own){(byParam[r.parametr]=byParam[r.parametr]||[]).push(r);}
  const out=[];
  const noInherit=(tip[0]==="O"||tip[0]==="P")?new Set(["chekinish_eshik_ustidagi_element","chekinish_2_qavat_boshidan","bitta_oqda"]):new Set();
  for(const p in byParam){
    const mine=byParam[p].filter(r=>r.tiplar.includes(tip));
    if(mine.length){out.push(...mine.map(r=>({r,inh:false})));continue;}
    if(noInherit.has(p))continue;
    const base=byParam[p].filter(r=>r.tiplar.includes("U1"));
    out.push(...base.map(r=>({r,inh:true})));
  }
  return out;
}
function typeAvailable(type){

  if(type==="devor_substratli"&&(S.meros||t==="U5"||t==="U6"))return[false,S.meros?"Madaniy meros binosida faqat substratsiz harflar (100-bet)":"Piyoda ko'chasi va maydonda taqiqlangan (106-bet)"];
  if(type==="visor"&&S.meros)return[false,"Madaniy meros binosida faqat substratsiz harflar (100-bet)"];
  if(type==="visor"&&!S.visorPass)return[false,"Fasad pasportida visor bo'lishi kerak (108-bet)"];
  if(type==="konsol"&&S.meros)return[false,"Madaniy meros binosida faqat substratsiz harflar (100-bet)"];
  return[true,""];
}

  if(r.op==="range")return Array.isArray(v[0])?v.map(a=>a.join("–")).join(" × ")+" sm":v[0]+"–"+v[1]+" "+u.split(" ")[0];

  if(r.op===">="){if(val>=v)return"ok";if(val>=v-t)return"edge";return"fail";}
  if(r.op==="=="){if(Math.abs(val-v)<=t)return"ok";if(Math.abs(val-v)<=3*t)return"edge";return"fail";}

function finalize(r,res,label){
  if(!res)return null;
  let st;
  if(res.st==="ok")st="ok";
  else if(res.st==="need")st="pend";
  else if(res.st==="edge")st="warn";
  else st=(r.turi==="tavsiya"||r.holat==="korib_chiqish"||r.turi==="ruxsat")?"warn":"bad";
  if(st==="ok"&&r.holat==="korib_chiqish"&&S.meros&&r.parametr==="meros_taqiq")st="warn";
  return{r,st,val:res.val,msg:res.msg,label,inh:res.inh};
}
function evaluate(){
  S.signs.forEach(layout);
  if(!S.view){S.items=[];S.badSigns=new Set();document.getElementById('sum').innerHTML='';document.getElementById('groups').innerHTML='<p class="hint">Tekshiruv rasm tekislanib, masshtab va do\'kon fasadi belgilangandan keyin boshlanadi.</p>';draw();return;}
  const items=[];
  const seen=new Set();
  for(const s of S.signs){
    const lbl=TYPES_V1[s.type].split(" — ")[0]+" #"+s.id;
    for(const {r,inh} of rulesFor(s.type,S.tip)){
      const ev=EV[r.parametr];
      let res=null;
      if(ev){res=ev(r,s);if(res)res.inh=inh;}
      else if(r.tekshiruv==="bayon"&&r.turi!=="ruxsat"&&r.turi!=="tavsiya"){const c=!!s.confirms[r.id];res={st:c?"ok":"need",val:c?"tasdiqlandi":"",msg:"Tasdiqlang",confirm:s.id,inh};}
      else if(r.tekshiruv==="subyektiv"&&r.turi!=="ruxsat"){res={st:"edge",val:"",msg:"Komissiya ko'radi",inh};}
      else if(r.tekshiruv==="geometrik"&&r.turi!=="ruxsat"){res={st:"need",val:"",msg:"Prototipda hali hisoblanmaydi",inh};}
      const f=finalize(r,res,lbl);if(f){if(res.confirm)f.confirm=res.confirm;items.push(f);}
    }
  }
  for(const r of RULES.filter(r=>r.viveska_turi==="*"&&r.tiplar.includes(S.tip))){
    if(seen.has(r.parametr))continue;seen.add(r.parametr);
    const g=GEN[r.parametr];let res=null;
    if(g)res=g(r);
    else if(r.tekshiruv==="bayon"&&r.turi==="majburiy"){const c=!!(S.genConf||{})[r.id];res={st:c?"ok":"need",val:c?"tasdiqlandi":"",msg:"Tasdiqlang",confirm:"gen"};}
    const f=finalize(r,res,"Butun fasad");if(f){if(res.confirm)f.confirm=res.confirm;items.push(f);}
  }
  S.items=items;
  S.badSigns=new Set(items.filter(i=>i.st==="bad"&&i.label!=="Butun fasad").map(i=>+i.label.split("#")[1]));
  renderResults(); draw();
}

const k=()=>DPR()/(FIT.f*Z.z);

const font=(w,px,fam)=>`${w} ${Math.round(px*k())}px ${fam||'"IBM Plex Sans", sans-serif'}`;

/* ---------- namuna ---------- */

/* ---------- eshik orqali tekislash ---------- */
const sortQ=c=>{const byY=[...c].sort((p,q)=>p[1]-q[1]);const t=byY.slice(0,2).sort((p,q)=>p[0]-q[0]),b=byY.slice(2).sort((p,q)=>p[0]-q[0]);return[t[0],t[1],b[1],b[0]];};
function rectify(){
  const q=sortQ(S.door.q),dw=S.door.w,dh=S.door.h;
  const Hc2i=homography([[0,0],[dw,0],[dw,dh],[0,dh]],q), Hi2c=homography(q,[[0,0],[dw,0],[dw,dh],[0,dh]]);
  const pts=[];const W=S.src.width,H=S.src.height;
  for(const[x,y]of[[0,0],[W,0],[W,H],[0,H],[W/2,0],[W/2,H],[0,H/2],[W,H/2]]){const w=Hi2c[6]*x+Hi2c[7]*y+1;if(w>0.05)pts.push(apply(Hi2c,x,y));}
  let bx0=Math.min(...pts.map(p=>p[0])),bx1=Math.max(...pts.map(p=>p[0])),by0=Math.min(...pts.map(p=>p[1])),by1=Math.max(...pts.map(p=>p[1]));
  bx0=Math.max(bx0,-3000);bx1=Math.min(bx1,dw+3000);by0=Math.max(by0,-6000);by1=Math.min(by1,dh+250);
  const s=Math.min(2200/(bx1-bx0),1500/(by1-by0));
  const F=document.createElement('canvas');F.width=Math.round((bx1-bx0)*s);F.height=Math.round((by1-by0)*s);
  warp(S.src,F,mul(Hc2i,[1/s,0,bx0,0,1/s,by0,0,0,1]));
  S.F=F;S.Fb={bx0,by0,s};
  if(!S.lines){S.lines={yT:detectCornice(),xL:-Math.round(dw*2),xR:Math.round(dw*3),yB:-30,y2:null};S.sub3=0;}
  clampEdges();
}
/* karniz/belbog'ni taxmin qilish: eshik ustidagi eng kuchli gorizontal chiziq */
function detectCornice(){
  const b=S.Fb,F=S.F,dw=S.door.w;const g=F.getContext('2d');
  const x0=Math.max(0,Math.round((-120-b.bx0)*b.s)),x1=Math.min(F.width-1,Math.round((dw+120-b.bx0)*b.s));
  const yA=Math.max(2,Math.round((-450-b.by0)*b.s)),yB=Math.min(F.height-3,Math.round((-30-b.by0)*b.s));
  if(x1-x0<10||yB-yA<10)return -Math.round(S.door.h*0.5);
  const d=g.getImageData(x0,yA-2,x1-x0,yB-yA+4).data,W=x1-x0;const lum=(r,c)=>{const i=(r*W+c)*4;return d[i+3]?0.3*d[i]+0.59*d[i+1]+0.11*d[i+2]:NaN;};
  let best=-1,bestY=null;
  for(let r=2;r<yB-yA+2;r++){let sum=0,n=0;for(let c=0;c<W;c+=2){const v=Math.abs(lum(r+2,c)-lum(r-2,c));if(!isNaN(v)){sum+=v;n++;}}if(n<W*0.3)continue;const e=sum/n;if(e>best){best=e;bestY=r;}}

function upperFloorH(){const L=S.lines;if(!S.show2||!L||L.y2==null)return null;return L.yT-L.y2;}
/* eshik koordinatalari (D) → dvigatel koordinatalari (do'kon fasadi chap-yuqori burchagidan) */
function syncGeometry(){

  S.W=Math.round(L.xR-L.xL);S.H=Math.round(dh-L.yT);

  const X=x=>x-L.xL,Y=y=>y-L.yT;
  S.elements=[{id:-1,kind:"eshik",x:X(0),y:Y(0),w:dw,h:dh}];
  if(S.bezak)S.elements.push({id:-2,kind:"memoriy",x:X(-20),y:Y(L.yB),w:dw+40,h:Math.max(4,-L.yB-4)});
  S.windows.forEach((w,i)=>S.elements.push({id:-10-i,kind:"deraza",x:X(w.x),y:Y(w.y),w:w.w,h:w.h}));

const D2px=(x,y)=>{const b=S.Fb;return[(x-b.bx0)*b.s,(y-b.by0)*b.s];};
const px2D=(X,Y)=>{const b=S.Fb;return[X/b.s+b.bx0,Y/b.s+b.by0];};
/* binafsha chiziqlar doim rasm ichida qoladi — chetdan chiqib ketib, ushlab bo'lmay qolmasin */

/* ko'rinib turgan qism (dunyo px) — tutqichni ekranning o'rtasiga qo'yish uchun */

/* ---------- peshlavhani zonaga joylash ---------- */
function zoneFor(s){
  const d=doorRef();if(d==null)return null;
  const sub=rulesFor(s.type,S.tip);const get=p=>{const x=sub.find(o=>o.r.parametr===p);return x?x.r.qiymat:0;};
  if(["devor_substratsiz","devor_substratli"].includes(s.type)){
    const top=get("chekinish_2_qavat_boshidan")||5,bot=get("chekinish_eshik_ustidagi_element")||5,ratio=get("uzunlik_fasad_kengligiga_nisbat")||1;
    const jl=sub.filter(o=>o.r.parametr==="joylashuv").some(o=>Array.isArray(o.r.qiymat)&&o.r.qiymat.includes("2_qavat_darajasi"));
    const h2=upperFloorH();
    return{y0:top,y1:d-bot,maxW:S.W*ratio,z2:jl&&h2?{y0:-h2+top,y1:-top}:null};}
  return null;

function placeSign(s){
  layout(s);const door=S.elements.find(e=>e.kind==="eshik");const cx=door?door.x+door.w/2:S.W/2;
  const z=zoneFor(s);
  if(s.type==="axborot_plitasi"&&door){s.x=Math.round(door.x+door.w+10);s.y=Math.round(S.H-120-s.h);}
  else if(s.type==="konsol"&&door){s.x=Math.round(Math.min(S.W-60-s.w,door.x+door.w+60));s.y=z?Math.round((z.y0+z.y1)/2-s.h/2):20;}
  else if(z){s.x=Math.round(cx-s.w/2);s.y=Math.round((z.y0+z.y1)/2-s.h/2);}
  else{s.x=Math.round(cx-s.w/2);s.y=Math.round(door?door.y-s.h-20:20);}
  s.x=Math.max(0,Math.min(s.x,S.W-s.w));

/* ---------- chizish ---------- */

    const sc=1;S.sc=1;fitWorld(S.src.width,S.src.height);

      ctx.strokeText(`Eshik ${S.door.w}×${S.door.h} sm`,c[0],c[1]);ctx.fillText(`Eshik ${S.door.w}×${S.door.h} sm`,c[0],c[1]);ctx.textAlign="start";
    }

  if(S.step===3)drawFacadeLines(KK);

function hint(){const h=document.getElementById('hint');if(!h)return;const t={1:"",2:"Oq nuqtalarni eshik burchaklariga suring",3:S.sub3===0?"Ko'k chiziqni do'kon qavati tepasiga suring":"Do'kon chetini rasm ustida bosing yoki binafsha tutqichni suring",4:"Peshlavhani suring · g'ildirak — yaqinlashtirish"}[S.step]||"";h.textContent=t;h.hidden=!t;}

/* chizg'ichlar: gorizontal — do'kon chap chetidan, vertikal — trotuardan balandlik */
function rulerMap(){
  if(S.step===4&&S.view){const v=S.view;return{a:1/v.s,bX:v.x0,bY:v.y0,cH:S.H};}
  if(S.step===3&&S.Fb&&S.lines){const b=S.Fb;return{a:1/b.s,bX:b.bx0-S.lines.xL,bY:b.by0,cH:S.door.h};}
  return null;}
function drawRulers(){

  const steps=[1,2,5,10,20,50,100,200,500,1000,2000];let st=steps.find(x=>x*ppc>=9*B)||2000;const major=st*5;

function vline(x,label,K,color,knob){const[X]=D2px(x,0);ctx.strokeStyle=color;ctx.lineWidth=3*K;ctx.setLineDash([10*K,6*K]);ctx.beginPath();ctx.moveTo(X,0);ctx.lineTo(X,FIT.H);ctx.stroke();ctx.setLineDash([]);

  if(s.y>0&&s.y+s.h<=S.H)dimLine(L,y0,L,y,`${Math.round(s.y)}`,K,-1);
  const d=doorRef();if(d!=null&&s.y+s.h<d){const[,yd]=toPx(0,d);dimLine(L,y+h,L,yd,`${Math.round(d-s.y-s.h)}`,K,-1);}
  dimLine(x+w+14*K,y+h,x+w+14*K,yG,`yerdan ${Math.round(S.H-s.y-s.h)} sm`,K,1);
  if(s.x>0)dimLine(x0,y+h/2,x,y+h/2,`${Math.round(s.x)}`,K);}
function drawSigns(K){
  const v=S.view,sel=S.signs.find(s=>s.id===S.sel);
  const[a,b]=toPx(0,0),[c,d]=toPx(S.W,S.H);
  const drawGuides=()=>{for(const g of S.guides){ctx.save();ctx.strokeStyle="#E0218A";ctx.lineWidth=1.2*K;ctx.setLineDash([5*K,4*K]);ctx.beginPath();if(g.x!=null){const[X]=toPx(g.x,0);ctx.moveTo(X,0);ctx.lineTo(X,FIT.H);}else{const[,Y]=toPx(0,g.y);ctx.moveTo(0,Y);ctx.lineTo(FIT.W,Y);}ctx.stroke();ctx.restore();}};
  ctx.setLineDash([6*K,4*K]);ctx.strokeStyle="rgba(255,255,255,.85)";ctx.lineWidth=1.5*K;ctx.strokeRect(a,b,c-a,d-b);ctx.setLineDash([]);
  if(S.night){ctx.fillStyle="rgba(6,10,24,.68)";ctx.fillRect(0,0,FIT.W,FIT.H);}
  const z=sel&&zoneFor(sel);
  if(z&&z.y1>z.y0&&!S.night){const[,q]=toPx(0,z.y0),[,r]=toPx(0,z.y1);ctx.fillStyle="rgba(52,199,89,.22)";ctx.fillRect(a,q,c-a,r-q);ctx.strokeStyle="#34C759";ctx.lineWidth=2*K;ctx.setLineDash([6*K,4*K]);ctx.strokeRect(a,q,c-a,r-q);ctx.setLineDash([]);
    pill("Peshlavha shu yashil zonaga",a+6*K,q-4*K,K,"#25744A");
    if(z.z2){const[,q2]=toPx(0,z.z2.y0),[,r2]=toPx(0,z.z2.y1);ctx.fillStyle="rgba(52,199,89,.12)";ctx.fillRect(a,q2,c-a,r2-q2);ctx.strokeStyle="#34C759";ctx.setLineDash([3*K,4*K]);ctx.strokeRect(a,q2,c-a,r2-q2);ctx.setLineDash([]);pill("2-qavat darajasi ham mumkin",a+6*K,q2+20*K,K,"#25744A");}}
  drawGuides();
  for(const s of S.signs){
    const[x,y]=toPx(s.x,s.y),w=s.w*v.s,h=s.h*v.s,L=s.letterH*v.s;
    paintSign(s,x,y,w,h,L,K);
    const probs=(S.items||[]).filter(i=>i.sid===s.id&&i.st==="bad");
    const col=probs.length?"#FF3B30":"#34C759";
    if(!S.night||probs.length){ctx.lineWidth=(s.id===S.sel?3:2)*K*(S.night?.7:1);ctx.strokeStyle=col;ctx.strokeRect(x-3*K,y-3*K,w+6*K,h+6*K);}
    if(s.mode==="logo"&&s.id===S.sel){ctx.fillStyle=col;ctx.fillRect(x+w-7*K,y+h-7*K,14*K,14*K);}
    if(s.id===S.sel&&!S.night)drawDims(s,K);
    if(probs.length){ctx.font=font(600,13);let yy=y+h+24*K;for(const p of probs.slice(0,3)){pill("✕ "+short(p),x,yy,K,"#C0392B");yy+=26*K;}}
  }
}

/* ---------- yoritish ko'rinishi ---------- */
function cctColor(k){if(k<=2900)return"#FFD08A";if(k<=3200)return"#FFDDA8";if(k<=3700)return"#FFE9C7";if(k<=4200)return"#FFF4E2";if(k<=5000)return"#F4F6FF";return"#E2ECFF";}
function textRuns(s,x,y,L){const v=S.view,ox=x+((s.type==="devor_substratli"?s.pad:0)+(s.lw||0)+(s.lg||0))*v.s,oy=y+((s.type==="devor_substratli"?s.pad:0)+(s.ty||0))*v.s,A=(s.altH||s.letterH)*v.s;
  const f=h=>`600 ${h/CAP}px "IBM Plex Sans", sans-serif`;const st=s.layout==="ostma"&&s.alt,ka=st?({chap:0,markaz:.5,ong:1}[s.align||"chap"]):0;
  const r=[{t:s.uz.toUpperCase(),x:ox+ka*((s.tw||0)-s.uzW)*v.s,y:oy+L,f:f(L)}];
  if(s.alt){if(st)r.push({t:s.alt.toUpperCase(),x:ox+ka*((s.tw||0)-s.altW)*v.s,y:oy+L*1.5+A,f:f(A)});else r.push({t:s.alt.toUpperCase(),x:ox+(s.uzW+s.letterH*0.9)*v.s,y:oy+L,f:f(A)});}
  return r;}
function drawRuns(runs){for(const r of runs){ctx.font=r.font||r.f;ctx.fillText(r.t,r.x,r.y);}}
function paintSign(s,x,y,w,h,L,K){
  const night=S.night,lit=s.light&&s.light!=="yoq",gc=cctColor(s.cct||3500),gl=Math.max(.3,Math.min(1.6,(s.lum||100)/100));
  ctx.save();
  if(s.mode==="panel"){
    const glow=lit&&(s.light==="ikki_tomonlama"||s.light==="ichki");
    if(glow){ctx.shadowColor=gc;ctx.shadowBlur=(night?30:12)*K*gl;ctx.fillStyle=night?gc:"#FFFBF2";}else ctx.fillStyle="#1F2A30";
    ctx.fillRect(x,y,w,h);ctx.shadowBlur=0;
    ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.font=`600 ${Math.max(6,h*0.35)}px "IBM Plex Sans"`;ctx.fillStyle=glow?"#1F2A30":"#F7F3E8";ctx.fillText(s.uz.toUpperCase(),x+3,y+h*0.62);
    ctx.restore();return;}
  if(s.type==="devor_substratli"){ctx.fillStyle=night&&s.light!=="tashqi"?"#0E1418":"#1F2A30";ctx.fillRect(x,y,w,h);}
  if(s.light==="tashqi"&&lit){
    const n=Math.max(2,Math.round(w/(120*S.view.s)));
    for(let i=0;i<n;i++){const cx=x+w*(i+.5)/n,ly=y-28*K;
      const R=Math.max(w/n,h*1.6);const g=ctx.createRadialGradient(cx,ly,1,cx,ly,R);g.addColorStop(0,night?"rgba(255,236,200,.75)":"rgba(255,240,210,.35)");g.addColorStop(.55,night?"rgba(255,226,180,.28)":"rgba(255,235,200,.12)");g.addColorStop(1,"rgba(255,226,180,0)");
      ctx.save();ctx.beginPath();ctx.moveTo(cx-4*K,ly);ctx.lineTo(cx+4*K,ly);ctx.lineTo(cx+w/n*.75,y+h+10*K);ctx.lineTo(cx-w/n*.75,y+h+10*K);ctx.closePath();ctx.clip();ctx.fillStyle=g;ctx.fillRect(cx-R,ly,2*R,R*1.2);ctx.restore();
      ctx.strokeStyle="#2A2F35";ctx.lineWidth=3*K;ctx.beginPath();ctx.moveTo(cx,y-4*K);ctx.lineTo(cx,ly-6*K);ctx.lineTo(cx+10*K,ly);ctx.stroke();ctx.fillStyle="#2A2F35";ctx.fillRect(cx+6*K,ly-3*K,10*K,7*K);}
  }
  if(s.mode==="logo"&&s.logo){
    if(lit&&(s.light==="ichki"||s.light==="harflar_ichki")){ctx.shadowColor=gc;ctx.shadowBlur=(night?26:8)*K*gl;}
    if(lit&&s.light==="kontur"){ctx.shadowColor=gc;ctx.shadowBlur=(night?34:12)*K*gl;ctx.drawImage(s.logo,x,y,w,h);ctx.shadowBlur=0;ctx.filter="brightness(.35)";}
    if(night&&!lit)ctx.filter="brightness(.4)";
    ctx.drawImage(s.logo,x,y,w,h);ctx.restore();return;}
  const runs=textRuns(s,x,y,L);
  if(s.tlogo&&s.lw){const v=S.view,p=(s.type==="devor_substratli"?s.pad:0);ctx.save();
    if(lit&&s.light!=="tashqi"){ctx.shadowColor=gc;ctx.shadowBlur=(night?26:8)*K*gl;}else if(night)ctx.filter="brightness(.4)";
    ctx.drawImage(s.tlogo,x+p*v.s,y+(p+s.ly)*v.s,s.lw*v.s,s.lh*v.s);ctx.restore();}
  if(!lit){ctx.fillStyle=night?"#4A4F55":"#EDE7DA";drawRuns(runs);}
  else if(s.light==="ichki"||s.light==="harflar_ichki"){
    // harflar yuzasi ichidan yonadi: tashqi nur + yorqin yuz + ichki oq o'zak
    ctx.shadowColor=gc;ctx.shadowBlur=(night?34:10)*K*gl;ctx.fillStyle=gc;drawRuns(runs);
    ctx.shadowBlur=(night?14:4)*K*gl;drawRuns(runs);
    ctx.shadowBlur=0;ctx.fillStyle=night?"#FFFFFF":"#FFFDF7";ctx.globalAlpha=night?.9:.85;drawRuns(runs);ctx.globalAlpha=1;
    ctx.lineWidth=Math.max(1,L*0.035);ctx.strokeStyle=night?"rgba(255,255,255,.35)":"rgba(60,50,30,.35)";for(const r of runs){ctx.font=r.f;ctx.strokeText(r.t,r.x,r.y);}
  }
  else if(s.light==="kontur"){
    // orqa yoritish: devorda nur aurasi, harf yuzi qorong'i
    ctx.shadowColor=gc;ctx.shadowBlur=(night?55:16)*K*gl;ctx.fillStyle=gc;drawRuns(runs);drawRuns(runs);ctx.shadowBlur=(night?22:8)*K*gl;drawRuns(runs);drawRuns(runs);
    ctx.shadowBlur=0;ctx.fillStyle=night?"#1B1F24":"#3A3F45";drawRuns(runs);
  }
  else{ctx.fillStyle=night?"#F2E6CF":"#EDE7DA";drawRuns(runs);}
  ctx.restore();
}

function renderVerdict(){
  const V=document.getElementById('verdict');if(!V)return;
  const it=S.items||[];const bad=it.filter(i=>i.st==="bad"),warn=it.filter(i=>i.st==="warn"),pend=it.filter(i=>i.st==="pend");
  V.className="verdict "+(bad.length?"v-bad":warn.length?"v-warn":"v-ok");
  V.innerHTML=bad.length?`<b>${bad.length} ta talabga mos emas</b><span>Pastdagi tugmalar bilan tuzating yoki peshlavhani suring.</span>`:
    warn.length?`<b>Asosiy talablarga mos</b><span>${warn.length} ta band komissiya yoki kelishuvni talab qiladi.</span>`:`<b>Talablarga mos</b>`;
  document.getElementById('probs').innerHTML=bad.concat(warn.filter(i=>i.r.tekshiruv!=="subyektiv")).map((i,n)=>{const f=FIX[i.r.parametr];const adv=ADVICE[i.r.parametr];
    return`<div class="prob ${i.st==="warn"?"warn":""}"><span class="t">${esc(human(i.r.parametr))}: ${esc(i.val)}</span>
    <span class="m">Talab: ${esc(req(i.r)||i.r.manba.iqtibos)}${adv?". "+esc(adv):""}${i.msg&&i.msg!=="Komissiya ko'radi"?" "+esc(i.msg):""}</span>
    <span class="src">${esc(i.r.manba.bolim)} · ${i.r.manba.bet}-bet${i.r.qaror?" · talqin "+i.r.qaror:""}</span>
    ${f&&(i.sid||i.r.parametr==="ozbek_matni_ulushi")?`<button data-fix="${n}">Tuzatish</button>`:""}</div>`;}).join("");
  S._probs=bad.concat(warn.filter(i=>i.r.tekshiruv!=="subyektiv"));
  const tag={ok:"mos",warn:"ko'rib chiqish",bad:"mos emas",pend:"tasdiq kerak"};
  document.getElementById('allList').innerHTML=["bad","warn","pend","ok"].flatMap(st=>it.filter(i=>i.st===st)).map(i=>
    `<div class="mini"><span>${i.confirm?`<label><input type="checkbox" data-conf="${i.confirm}" data-rid="${i.r.id}" ${i.st==="ok"?"checked":""}>`:""}${esc(human(i.r.parametr))} <span style="color:var(--muted);font-family:var(--f-mono);font-size:11px">${i.r.manba.bet}-bet</span>${i.confirm?"</label>":""}</span><span class="s s-${i.st}">${tag[i.st]}</span></div>`).join("")+
    (pend.length?`<p class="lead" style="font-size:12px">"Tasdiq kerak" bandlari rasmdan o'lchanmaydi — belgi qo'yib tasdiqlang.</p>`:"");
}

function bindCard(){
  const $=id=>document.getElementById(id);
  $('next')&&$('next').addEventListener('click',()=>go(S.step+1));
  $('back')&&$('back').addEventListener('click',()=>go(S.step-1));
  if(S.step===1){
    $('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
      const sc=Math.min(1,2600/Math.max(im.width,im.height));const C=document.createElement('canvas');C.width=Math.round(im.width*sc);C.height=Math.round(im.height*sc);C.getContext('2d').drawImage(im,0,0,C.width,C.height);
      newPhoto(C);};im.src=fr.result;};fr.readAsDataURL(f);});
    $('rot').addEventListener('click',()=>{if(!S.src)return;const o=S.src,C=document.createElement('canvas');C.width=o.height;C.height=o.width;const g=C.getContext('2d');g.translate(C.width,0);g.rotate(Math.PI/2);g.drawImage(o,0,0);newPhoto(C);});
    $('tip').addEventListener('change',e=>{S.tip=e.target.value;});
    $('meros').addEventListener('change',e=>{S.meros=e.target.checked;});
    $('visorPass').addEventListener('change',e=>{S.visorPass=e.target.checked;});
  }
  if(S.step===2){
    $('dw').addEventListener('input',e=>{S.door.w=+e.target.value||100;draw();});
    $('dh').addEventListener('input',e=>{S.door.h=+e.target.value||210;draw();});
  }
  if(S.step===3){
    if($('sub3next'))$('sub3next').addEventListener('click',()=>{S.sub3=1;clampEdges();resetZoom();if(typeof dims==='function')dims();renderCard();draw();});
    if($('sub3back'))$('sub3back').addEventListener('click',()=>{S.sub3=0;renderCard();draw();});
    if($('show2'))$('show2').addEventListener('change',e=>{S.show2=e.target.checked;if(S.show2&&S.lines.y2==null)S.lines.y2=S.lines.yT-330;draw();});
    if($('bezak'))$('bezak').addEventListener('change',e=>{S.bezak=e.target.checked;draw();});
    $('addWin')&&$('addWin').addEventListener('click',()=>{const n=S.windows.length;S.windows.push({x:S.door.w+40+n*30,y:20+n*10,w:200,h:200});renderCard();draw();});
    $('delWin')&&$('delWin').addEventListener('click',()=>{S.windows.pop();renderCard();draw();});
  }
  if(S.step===4){
    const C=document.getElementById('card');
    C.addEventListener('input',onSignInput);C.addEventListener('change',onSignChange);C.addEventListener('click',onSignClick);
  }
}
function newPhoto(C){S.sub3=0;S.show2=false;S.src=C;S.sample=false;S.F=null;S.lines=null;S.windows=[];S.bezak=false;S.signs=[];S.view=null;
  const w=C.width,h=C.height;S.door.q=[[w*.42,h*.45],[w*.58,h*.45],[w*.58,h*.85],[w*.42,h*.85]];renderSteps();renderCard();draw();}
function curSign(){return S.signs.find(x=>x.id===S.sel);}
function onSignInput(e){const s=curSign(),t=e.target;if(!s||!t.id||!t.id.startsWith("f_")||t.type==="file")return;const k=t.id.slice(2);
  if(t.type==="checkbox")s[k]=k==="layout"?(t.checked?"ostma":"yonma"):t.checked;else if(t.type==="number"||t.type==="range")s[k]=+t.value;else s[k]=t.value;
  if(k==="letterH"&&document.getElementById('o_letterH'))document.getElementById('o_letterH').textContent=s.letterH+" sm";

  if(k==="alt"&&(!!t.value)!==(!!S._hadAlt)){S._hadAlt=!!t.value;if(t.value&&!s.altH)s.altH=Math.round(s.letterH*0.6);evaluate();renderCard();const el=document.getElementById('f_alt');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}return;}
  evaluate();}
function onSignChange(e){const t=e.target;if(t.id==="snapChk"){S.snap=t.checked;return;}if(t.id==="f_light"){if(t.value!=="yoq")S.night=true;renderCard();evaluate();return;}
  if(t.dataset.conf){if(t.dataset.conf==="gen"){S.genConf=S.genConf||{};S.genConf[t.dataset.rid]=t.checked;}else{const s=S.signs.find(x=>x.id==+t.dataset.conf);if(s)s.confirms[t.dataset.rid]=t.checked;}evaluate();return;}
  if(t.id==="f_tlogo"&&t.files[0]){const s=curSign();const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{s.tlogo=im;s.tlogoH=0;layout(s);placeSign(s);renderCard();evaluate();};im.src=fr.result;};fr.readAsDataURL(t.files[0]);return;}
  if(t.id==="f_logo"&&t.files[0]){const s=curSign();const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{s.logo=im;layout(s);placeSign(s);evaluate();};im.src=fr.result;};fr.readAsDataURL(t.files[0]);}}
function onSignClick(e){const b=e.target.closest('button');if(!b)return;const s=curSign();
  if(b.dataset.type){if(s){const keep={uz:s.uz,alt:s.alt};const n=newSign(b.dataset.type,b.dataset.type==="konsol"||b.dataset.type==="axborot_plitasi"?{}:keep);n.id=s.id;Object.assign(s,n);placeSign(s);}renderCard();evaluate();return;}
  if(b.dataset.fix!=null){const i=S._probs[+b.dataset.fix];const sg=S.signs.find(x=>x.id===i.sid)||S.signs.find(x=>x.alt&&x.mode==="text")||curSign();FIX[i.r.parametr](i,sg);layout(sg);if(i.r.parametr==="uzunlik_fasad_kengligiga_nisbat")placeSign(sg);renderCard();evaluate();return;}
  if(b.dataset.sel){S.sel=+b.dataset.sel;renderCard();evaluate();return;}
  if(b.id==="dayBtn"||b.id==="nightBtn"){S.night=b.id==="nightBtn";renderCard();draw();return;}
  if(b.id==="mText"){s.mode="text";layout(s);renderCard();evaluate();}
  if(b.id==="mLogo"){s.mode="logo";renderCard();evaluate();}
  if(b.id==="lyY"||b.id==="lyO"){s.layout=b.id==="lyO"?"ostma":"yonma";s.tlogoH=0;layout(s);placeSign(s);renderCard();evaluate();}
  if(b.dataset.al){s.align=b.dataset.al;renderCard();evaluate();return;}
  if(b.dataset.pos){const door=S.elements.find(e=>e.kind==="eshik");const z=zoneFor(s);const m=2;
    if(b.dataset.pos==="chap")s.x=m;else if(b.dataset.pos==="ong")s.x=Math.round(S.W-s.w-m);
    else if(b.dataset.pos==="eshik"&&door)s.x=Math.round(door.x+door.w/2-s.w/2);else s.x=Math.round(S.W/2-s.w/2);
    if(z&&MAIN.has(s.type))s.y=Math.round((z.y0+z.y1)/2-s.h/2);evaluate();return;}
  if(b.id==="toAlbum"){toAlbum();return;}
  if(b.id==="tlogoDel"){s.tlogo=null;s.tlogoH=0;layout(s);renderCard();evaluate();}
  if(b.id==="addSign"){const t=Object.keys(TYPES_V1).find(t=>typeAvailable(t)[0]&&!MAIN.has(t))||firstAvailable();const n=newSign(t);S.signs.push(n);S.sel=n.id;placeSign(n);renderCard();evaluate();}
  if(b.id==="delSign"){S.signs=S.signs.filter(x=>x.id!==S.sel);S.sel=S.signs[0]?S.signs[0].id:null;renderCard();evaluate();}
}

function facadePNG(){const F=S.F;if(!F)return null;const sc=Math.min(1,2400/F.width),oc=document.createElement('canvas');oc.width=Math.round(F.width*sc);oc.height=Math.round(F.height*sc);
  const old=ctx,oldN=S.night;ctx=oc.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,oc.width,oc.height);ctx.imageSmoothingQuality="high";ctx.setTransform(sc,0,0,sc,0,0);ctx.drawImage(F,0,0);
  const K=1/sc;try{for(const s of S.signs){const[x,y]=toPx(s.x,s.y);paintSign(s,x,y,s.w*S.view.s,s.h*S.view.s,s.letterH*S.view.s,K);}}finally{ctx=old;S.night=oldN;}
  return {src:oc.toDataURL('image/jpeg',.9),aspect:oc.width/oc.height};}
function checksSVG(){const it=(S.items||[]).filter(i=>i.st!=="pend");const tag={ok:"mos",warn:"ko'rib chiqish",bad:"mos emas"},col={ok:"#25744A",warn:"#8A5A00",bad:"#B3261E"};
  const rows=["bad","warn","ok"].flatMap(st=>it.filter(i=>i.st===st)).slice(0,14);const bad=it.filter(i=>i.st==="bad").length,warn=it.filter(i=>i.st==="warn").length;
  const W=180,rh=6.2,H=34+rows.length*rh+10,e=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const verdict=bad?`${bad} ta talabga mos emas`:warn?`Asosiy talablarga mos · ${warn} ta band ko'rib chiqiladi`:"Talablarga mos";
  let g=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}mm" height="${H}mm" font-family="Archivo, Arial, sans-serif"><rect width="${W}" height="${H}" fill="#fff"/>`+
   `<text x="0" y="6" font-size="5" font-weight="700" fill="#141414">Dizayn-kod: peshlavha tekshiruvi</text>`+
   `<text x="0" y="12" font-size="3" fill="#696969" font-family="IBM Plex Mono, monospace">Joy tipi ${e(S.tip)} · VII-19-17-14-0-K/26, 2-ilova, P2.3 §2</text>`+
   `<rect x="0" y="16" width="${W}" height="9" fill="${bad?'#F9E1DE':warn?'#F7EACB':'#DDF0E4'}"/><text x="3" y="22" font-size="3.6" font-weight="700" fill="${bad?col.bad:warn?col.warn:col.ok}">${e(verdict)}</text>`;
  let y=30;g+=`<text x="0" y="${y}" font-size="2.6" fill="#696969">TALAB</text><text x="92" y="${y}" font-size="2.6" fill="#696969">NATIJA</text><text x="140" y="${y}" font-size="2.6" fill="#696969">HOLAT</text><text x="${W}" y="${y}" font-size="2.6" fill="#696969" text-anchor="end">BET</text>`;
  rows.forEach(i=>{y+=rh;g+=`<line x1="0" x2="${W}" y1="${y-rh+1.6}" y2="${y-rh+1.6}" stroke="#dedcd7" stroke-width=".2"/><text x="0" y="${y}" font-size="3" fill="#141414">${e(human(i.r.parametr)).slice(0,48)}</text><text x="92" y="${y}" font-size="3" fill="#3c3c3c">${e(i.val||'').slice(0,26)}</text><text x="140" y="${y}" font-size="3" font-weight="700" fill="${col[i.st]}">${tag[i.st]}</text><text x="${W}" y="${y}" font-size="3" fill="#696969" text-anchor="end">${i.r.manba.bet}</text>`;});
  return {svg:g+`</svg>`,aspect:W/H};}
async function toAlbum(){if(!S.F||!S.signs.length){alert("Avval peshlavhani joylang.");return;}
  const put=o=>new Promise((res,rej)=>{const r=indexedDB.open('kps_mat',1);r.onupgradeneeded=()=>r.result.createObjectStore('mats',{keyPath:'id'});r.onsuccess=()=>{const tx=r.result.transaction('mats','readwrite');tx.objectStore('mats').put(o);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);};r.onerror=()=>rej(r.error);});

/* ---------- magnit ---------- */
function snapMove(s,nx,ny,off){
  S.guides=[];if(!S.snap||off)return[nx,ny];
  const thr=8*DPR()/(Z.z*FIT.f*S.view.s);const z=zoneFor(s),door=S.elements.find(e=>e.kind==="eshik");
  const xs=[],ys=[];
  if(door)xs.push({c:door.x+door.w/2,k:"c"});xs.push({c:S.W/2,k:"c"},{c:0,k:"l"},{c:S.W,k:"r"});
  for(const o of S.signs)if(o!==s){xs.push({c:o.x,k:"l"},{c:o.x+o.w,k:"r"},{c:o.x+o.w/2,k:"c"});ys.push({c:o.y+o.h/2,k:"m"},{c:o.y,k:"t"},{c:o.y+o.h,k:"b"});}
  for(const e of S.elements)if(e.kind==="qoshni")ys.push({c:e.y+e.h/2,k:"m"});
  if(z){ys.push({c:z.y0,k:"t"},{c:z.y1,k:"b"},{c:(z.y0+z.y1)/2,k:"m"});}
  if(door)xs.push({c:door.x,k:"r2"},{c:door.x+door.w,k:"l2"});
  const ofX={l:0,c:s.w/2,r:s.w,l2:0,r2:s.w},ofY={t:0,m:s.h/2,b:s.h};
  let bx=null,by=null;
  for(const t of xs){const d=Math.abs(nx+ofX[t.k]-t.c);if(d<thr&&(!bx||d<bx.d))bx={d,v:t.c-ofX[t.k],g:t.c};}
  for(const t of ys){const d=Math.abs(ny+ofY[t.k]-t.c);if(d<thr&&(!by||d<by.d))by={d,v:t.c-ofY[t.k],g:t.c};}
  if(bx){nx=bx.v;S.guides.push({x:bx.g});}if(by){ny=by.v;S.guides.push({y:by.g});}
  return[Math.round(nx),Math.round(ny)];
}

let drag=null;
function ptrS(e){const b=cv.getBoundingClientRect();return[(e.clientX-b.left)*cv.width/b.width,(e.clientY-b.top)*cv.height/b.height];}

let spaceDown=false;window.addEventListener('keydown',e=>{if(e.code==="Space"&&e.target===document.body){spaceDown=true;e.preventDefault();}});window.addEventListener('keyup',e=>{if(e.code==="Space")spaceDown=false;});
cv.addEventListener('wheel',e=>{if(!S.src&&!S.F)return;e.preventDefault();const[sx,sy]=ptrS(e);zoomAt(Math.exp(-e.deltaY*0.0016),sx,sy);},{passive:false});
document.getElementById('zIn').addEventListener('click',()=>zoomAt(1.4,cv.width/2,cv.height/2));
document.getElementById('zOut').addEventListener('click',()=>zoomAt(1/1.4,cv.width/2,cv.height/2));
document.getElementById('zFit').addEventListener('click',()=>{resetZoom();draw();});
function startPan(e){const[sx,sy]=ptrS(e);drag={t:"pan",sx,sy,px:Z.px,py:Z.py};cv.style.cursor="grabbing";}
cv.addEventListener('pointerdown',e=>{const[X,Y]=ptr(e);const K=k();cv.setPointerCapture(e.pointerId);
  if(e.button===1||spaceDown){startPan(e);return;}
  if(S.step===2&&S.door.q.length){const sc=S.sc;const i=S.door.q.findIndex(p=>Math.hypot(p[0]*sc-X,p[1]*sc-Y)<20*K);
    if(i>=0){drag={t:"corner",i};return;}
    const c=S.door.q.reduce((a,p)=>[a[0]+p[0]/4,a[1]+p[1]/4],[0,0]);if(Math.hypot(c[0]*sc-X,c[1]*sc-Y)<80*K){drag={t:"quad",X,Y,q:S.door.q.map(p=>[...p])};return;}if(Z.z>1)startPan(e);return;}
  if(S.step===3){const[x,y]=px2D(X,Y),L=S.lines,tol=14*K/S.Fb.s;
    for(let n=S.windows.length-1;n>=0;n--){const w=S.windows[n];if(Math.abs(x-(w.x+w.w))<tol&&Math.abs(y-(w.y+w.h))<tol){drag={t:"winR",w};return;}if(x>w.x&&x<w.x+w.w&&y>w.y&&y<w.y+w.h){drag={t:"winM",w,dx:x-w.x,dy:y-w.y};return;}}
    if(S.bezak&&Math.abs(y-L.yB)<tol&&x>-40&&x<S.door.w+40){drag={t:"yB"};return;}
    if(Math.abs(y-L.yT)<tol){drag={t:"yT"};return;}
    if(S.show2&&L.y2!=null&&Math.abs(y-L.y2)<tol){drag={t:"y2"};return;}
    if(S.sub3>0){const t2=tol*1.6;if(Math.abs(x-L.xL)<t2){drag={t:"xL"};return;}if(Math.abs(x-L.xR)<t2){drag={t:"xR"};return;}
      /* chiziqni topa olmasa: eshikdan chapni bossa — chap chet, o'ngni bossa — o'ng chet shu joyga keladi */
      const[lo,hi]=edgeRange();if(x<0){L.xL=Math.round(Math.max(lo,Math.min(x,-5)));drag={t:"xL"};dims();draw();return;}
      if(x>S.door.w){L.xR=Math.round(Math.min(hi,Math.max(x,S.door.w+5)));drag={t:"xR"};dims();draw();return;}}
    if(Z.z>1)startPan(e);return;}
  if(S.step===4&&S.view){const[x,y]=toCm(X,Y);
    for(const s of[...S.signs].reverse()){
      if(s.mode==="logo"&&s.id===S.sel&&Math.abs(x-(s.x+s.w))<14*K/S.view.s&&Math.abs(y-(s.y+s.h))<14*K/S.view.s){drag={t:"resize",s};return;}
      if(x>=s.x&&x<=s.x+s.w&&y>=s.y&&y<=s.y+s.h){if(S.sel!==s.id){S.sel=s.id;renderCard();}drag={t:"move",s,dx:x-s.x,dy:y-s.y};evaluate();return;}}
    if(Z.z>1)startPan(e);}
});
cv.addEventListener('pointermove',e=>{const[X,Y]=ptr(e);
  if(S.step>=3){S.mouse=[X,Y];if(!drag){draw();}}
  if(drag&&drag.t==="pan"){const[sx,sy]=ptrS(e);Z.px=drag.px-(sx-drag.sx);Z.py=drag.py-(sy-drag.sy);clampPan();draw();return;}
  if(!drag){let c="default";if(S.step===3){const[x,y]=px2D(X,Y),L=S.lines,tol=14*k()/S.Fb.s;if(Math.abs(y-L.yT)<tol||(S.show2&&Math.abs(y-L.y2)<tol)||(S.bezak&&Math.abs(y-L.yB)<tol))c="ns-resize";else if(S.sub3>0&&(x<0||x>S.door.w))c="ew-resize";}
    else if(S.step===2||S.step===4)c=Z.z>1?"grab":"default";if(spaceDown)c="grab";cv.style.cursor=c;return;}
  if(drag.t==="corner"){S.door.q[drag.i]=[X/S.sc,Y/S.sc];draw();return;}
  if(drag.t==="quad"){const dx=(X-drag.X)/S.sc,dy=(Y-drag.Y)/S.sc;S.door.q=drag.q.map(p=>[p[0]+dx,p[1]+dy]);draw();return;}
  if(S.step===3){const[x,y]=px2D(X,Y),L=S.lines;
    if(drag.t==="yT"){L.yT=Math.round(Math.min(y,-20));}if(drag.t==="y2"){L.y2=Math.round(Math.min(y,L.yT-150));}if(drag.t==="yB")L.yB=Math.round(Math.max(L.yT+5,Math.min(y,-6)));
    {const[lo,hi]=edgeRange();if(drag.t==="xL")L.xL=Math.round(Math.max(Math.min(lo,-5),Math.min(x,-5)));if(drag.t==="xR")L.xR=Math.round(Math.min(Math.max(hi,S.door.w+5),Math.max(x,S.door.w+5)));}
    if(drag.t==="winM"){drag.w.x=Math.round(x-drag.dx);drag.w.y=Math.round(y-drag.dy);}if(drag.t==="winR"){drag.w.w=Math.max(20,Math.round(x-drag.w.x));drag.w.h=Math.max(20,Math.round(y-drag.w.y));}
    dims();draw();return;}
  if(S.step===4){const[x,y]=toCm(X,Y);
    if(drag.t==="move"){const[nx,ny]=snapMove(drag.s,x-drag.dx,y-drag.dy,e.altKey);drag.s.x=nx;drag.s.y=ny;evaluate();}
    if(drag.t==="resize"){drag.s.logoW=Math.max(10,Math.round(x-drag.s.x));evaluate();}}
});
cv.addEventListener('pointerup',()=>{if(drag&&S.step===4)renderVerdict();drag=null;S.guides=[];draw();});
cv.addEventListener('pointerleave',()=>{S.mouse=null;if(!drag)draw();});
function fitLayout(){const w=document.querySelector('.wrap');if(!w)return;if(window.innerWidth<=900){w.style.height='';return;}const t=w.getBoundingClientRect().top+window.scrollY;const pb=parseFloat(getComputedStyle(document.body).paddingBottom)||0;w.style.height=Math.max(460,window.innerHeight-t-pb-12)+'px';}
window.addEventListener('resize',()=>{fitLayout();draw();});
if(window.ResizeObserver)new ResizeObserver(()=>draw()).observe(document.querySelector('.stage'));

/* ---------- ishga tushirish ---------- */
const boot=()=>{fitLayout();makeSample();S.step=4;renderSteps();renderCard();evaluate();draw();};
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(boot);else boot();
</script>
