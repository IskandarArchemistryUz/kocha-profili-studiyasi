name: Master reja — testlar
on:
  push:
    branches: [main]
    paths: ['mr/**', 'app/**', 'index.html', 'css/**', 'js/site.js', '.github/workflows/master-reja.yml']
  pull_request:
    paths: ['mr/**', 'app/**', 'index.html', 'css/**', 'js/site.js', '.github/workflows/master-reja.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write, issues: write }
    defaults: { run: { working-directory: mr } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mr/package-lock.json }
      - run: npm ci
      - name: Birlik testlari
        run: npm test
      - name: Yigʻish (tur tekshiruvi bilan)
        run: npm run build
      - name: Saytdagi app/ yigʻilgan natija bilan bir xilmi
        run: git diff --exit-code -- ../app ../css/ds2.css || (echo "app/ eskirgan — mr ichida npm run build qiling va natijani commit qiling" && exit 1)
      - run: npx playwright install --with-deps chromium
      - name: E2E testlar
        run: npm run e2e 2>&1 | tee e2e.log; exit ${PIPESTATUS[0]}
        shell: bash
        env: { CI: 'true' }
      - name: E2E xatolari (PR izohiga)
        if: failure() && github.event_name == 'pull_request'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          { echo '**E2E yiqildi** — urinish ${{ github.run_attempt }}:'; echo '```'; grep -E "✘|Error:|Expected|Received|expect\(|waiting for|Timeout" e2e.log | head -60; echo '```'; } > /tmp/c.md || true
          cat /tmp/c.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/c.md
