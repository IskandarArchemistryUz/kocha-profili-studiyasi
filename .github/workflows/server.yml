name: Server — testlar
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    defaults: { run: { working-directory: server } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: t, POSTGRES_PASSWORD: t, POSTGRES_DB: t }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - name: Testlar — PGlite
        run: npm test
      - name: Testlar — haqiqiy PostgreSQL 16
        run: npm test
        env: { TEST_DATABASE_URL: 'postgres://t:t@127.0.0.1:5432/t' }
