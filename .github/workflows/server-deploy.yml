name: Server — deploy (api.archemistry.uz)
# main ga server/ oʻzgarishi tushsa (testlardan keyin) — VPS da yangilash. Sirlar (Settings → Secrets → Actions):
#   VPS_HOST — server IP yoki nomi, VPS_SSH_KEY — archemistry foydalanuvchisining maxfiy SSH kaliti (matn yoki base64).
#   OWNER_EMAILS (ixtiyoriy) — egasi pochtasi; berilsa serverdagi .env dagi OWNER_EMAILS shu qiymatga yangilanadi.
#   ARCGIS_API_KEY (ixtiyoriy) — Esri ochiq kaliti (faqat Basemaps, referrer bilan cheklangan); .env ga yoziladi, /config/maps beradi.
#   CDS_API_KEY (ixtiyoriy) — Copernicus CDS shaxsiy tokeni (ERA5 shamol, /data/wind); faqat .env ga, ilovaga berilmaydi.
# Sirlar qoʻyilmagan boʻlsa — ish oʻtkazib yuboriladi (xato emas).
on:
  workflow_run:
    workflows: ['Server — testlar']
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency: { group: server-deploy, cancel-in-progress: false }
jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      HOST: ${{ secrets.VPS_HOST }}
      KEY: ${{ secrets.VPS_SSH_KEY }}
      OWNERS: ${{ secrets.OWNER_EMAILS }}
      ARCGIS: ${{ secrets.ARCGIS_API_KEY }}
      CDS: ${{ secrets.CDS_API_KEY }}
    steps:
      - name: Sirlar bormi
        id: chk
        run: if [ -n "$HOST" ] && [ -n "$KEY" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "VPS sirlari qoʻyilmagan — deploy oʻtkazib yuborildi"; fi
      - name: Yangilash va qayta ishga tushirish
        if: steps.chk.outputs.ok == '1'
        run: |
          # kalit matn holida (-----BEGIN…) yoki bitta qatorli base64 da boʻlishi mumkin; Windows \r belgilari olib tashlanadi
          install -m 600 /dev/null key
          if printf '%s' "$KEY" | grep -q 'BEGIN OPENSSH'; then printf '%s\n' "$KEY" | tr -d '\r' > key; else printf '%s' "$KEY" | tr -d '\r\n ' | base64 -d > key; fi
          ssh-keygen -y -f key > /dev/null || { echo "VPS_SSH_KEY notoʻgʻri: kalitni qayta nusxalang (README, 6-band)"; exit 1; }
          # egasi pochtasi (sir berilgan boʻlsa): faqat ruxsat etilgan belgilar, .env dagi qator yangilanadi
          OW=$(printf '%s' "$OWNERS" | tr -cd 'A-Za-z0-9@._+,-')
          # Esri ochiq kaliti (sir berilgan bo'lsa): faqat ruxsat etilgan belgilar
          AK=$(printf '%s' "$ARCGIS" | tr -cd 'A-Za-z0-9._-')
          # Copernicus CDS tokeni (sir berilgan bo'lsa): faqat ruxsat etilgan belgilar
          CK=$(printf '%s' "$CDS" | tr -cd 'A-Za-z0-9:._-')
          ssh -i key -o StrictHostKeyChecking=accept-new archemistry@"$HOST" "OW='$OW' AK='$AK' CK='$CK'"'
            set -e
            if [ -n "$OW" ]; then E=/srv/archemistry/server/.env; if grep -q "^OWNER_EMAILS=" "$E"; then sed -i "s/^OWNER_EMAILS=.*/OWNER_EMAILS=$OW/" "$E"; else printf "\nOWNER_EMAILS=%s\n" "$OW" >> "$E"; fi; fi
            if [ -n "$AK" ]; then E=/srv/archemistry/server/.env; if grep -q "^ARCGIS_API_KEY=" "$E"; then sed -i "s/^ARCGIS_API_KEY=.*/ARCGIS_API_KEY=$AK/" "$E"; else printf "\nARCGIS_API_KEY=%s\n" "$AK" >> "$E"; fi; fi
            if [ -n "$CK" ]; then E=/srv/archemistry/server/.env; if grep -q "^CDS_API_KEY=" "$E"; then sed -i "s/^CDS_API_KEY=.*/CDS_API_KEY=$CK/" "$E"; else printf "\nCDS_API_KEY=%s\n" "$CK" >> "$E"; fi; fi
            cd /srv/archemistry && git fetch --depth 50 origin main && git reset --hard origin/main
            cd server && npm ci --omit=dev
            sudo /usr/bin/systemctl restart archemistry-api
            sleep 2 && curl -fsS http://127.0.0.1:8080/health'
          rm -f key
