<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loyiha — Archemistry Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Bitta loyiha oynasi: tepada qadamlar, ostida joriy qadam asboblari, oʻngda — Master reja paneli */
:root{
  --ink:#141414; --grey:#696969; --txt:#3c3c3c; --bg:#f4f3f1; --line:#dedcd7; --paper:#fbfaf7; --acc:#c2432b;
  --f-head:"Archivo",system-ui,sans-serif; --f-sans:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--f-sans);display:grid;grid-template-rows:auto auto minmax(0,1fr)}
a{color:inherit}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.top{display:flex;align-items:center;gap:14px;padding:0 14px;height:54px;border-bottom:1px solid var(--ink);background:var(--paper);min-width:0}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font:600 13px var(--f-mono);letter-spacing:.14em;flex:none}
.brand svg{flex:none}
.pname{font:600 16px var(--f-head);border:0;border-bottom:1px dashed transparent;background:transparent;width:13em;min-width:6em;padding:2px 0;color:var(--ink)}
.pname:hover,.pname:focus{border-bottom-color:var(--grey);outline:none}

.steps{display:flex;align-items:stretch;margin:0 auto;height:100%;min-width:0;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{display:flex;align-items:center;gap:8px;padding:0 14px;border:0;background:none;cursor:pointer;position:relative;white-space:nowrap;color:var(--grey)}
.step .n{width:22px;height:22px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font:500 11px var(--f-mono)}
.step .t{font:500 14px var(--f-sans)}
.step+.step::before{content:"";position:absolute;left:-6px;top:50%;width:12px;height:1px;background:var(--line)}
.step.seen{color:var(--txt)}
.step.seen .n{background:var(--line);border-color:var(--line)}
.step[aria-current="step"]{color:var(--ink)}
.step[aria-current="step"] .n{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.step[aria-current="step"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;background:var(--ink)}
.step:hover{color:var(--ink)}

.pwrap{position:relative;display:flex;align-items:center;gap:2px;flex:none}
.pmenu-btn{border:0;background:none;cursor:pointer;font-size:12px;padding:4px 6px;color:var(--grey)}
.pmenu{position:absolute;top:calc(100% + 10px);left:0;z-index:20;width:300px;background:var(--paper);border:1px solid var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.12);display:grid}
.pmenu[hidden]{display:none}
.pmenu .ph{padding:10px 12px 6px;font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--grey)}
.pmenu .pi{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.pmenu .pi.on{background:var(--bg)}
.pmenu .pi button.nm{border:0;background:none;text-align:left;cursor:pointer;font:500 14px var(--f-sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0}
.pmenu .pi .tm{font:11px var(--f-mono);color:var(--grey)}
.pmenu .pi button.del{border:0;background:none;color:var(--grey);cursor:pointer;font:12px var(--f-mono)}
.pmenu .pi button.del.sure{color:var(--acc)}
.pmenu .pf{padding:10px 12px;border-top:1px solid var(--ink)}
.cover{position:fixed;inset:0;z-index:50;background:rgba(244,243,241,.85);display:grid;place-items:center;font:13px var(--f-mono)}
.cover[hidden]{display:none}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.btn{height:32px;padding:0 12px;border:1px solid var(--ink);background:transparent;border-radius:2px;font:500 12px var(--f-mono);letter-spacing:.05em;cursor:pointer;white-space:nowrap}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.sub{display:flex;align-items:center;gap:16px;padding:0 14px;height:42px;border-bottom:1px solid var(--line);background:var(--bg);min-width:0}
.subtabs{display:flex;border:1px solid var(--line);flex:none}
.subtabs:empty{display:none}
.subtabs button{border:0;border-right:1px solid var(--line);background:transparent;padding:5px 12px;font:500 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.subtabs button:last-child{border-right:0}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.hint{font:12px var(--f-mono);color:var(--grey);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.next{margin-left:auto}

.stage{position:relative;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) auto}
.frames{position:relative;min-width:0}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.frames iframe[hidden]{display:none}
.loading{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font:12px var(--f-mono);padding:6px 14px;z-index:2}

.drawer{width:0;overflow:hidden;border-left:1px solid var(--ink);background:var(--paper);display:grid;grid-template-rows:auto minmax(0,1fr);transition:width .22s ease}
.drawer.open{width:min(560px,46vw)}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--grey)}
.drawer .dh button{border:0;background:none;font-size:18px;cursor:pointer;line-height:1}
.drawer iframe{width:100%;height:100%;border:0}
/* telefon uchun pastki qadamlar paneli — faqat kichik ekranda */
.stepsM{display:none}
/* planshet: qadam nomlari qisqaroq, koʻrsatma yashirin */
@media (max-width:1200px){
  .brand{font-size:0;gap:0}
  .hint{display:none}
  .step{padding:0 9px}
  .pname{width:9em}
  .drawer.open{position:absolute;right:0;top:0;bottom:0;width:min(560px,100vw);z-index:5}
}
/* telefon va planshet (tik holatda): qadamlar pastki panelda, tepada faqat loyiha nomi va Master reja */
@media (max-width:900px){
  body{grid-template-rows:auto auto minmax(0,1fr) auto}
  .top{height:48px;gap:8px;padding:0 10px}
  .brand{font-size:0;gap:0}
  .pname{width:auto;flex:1;min-width:0;font-size:15px}
  .pwrap{flex:1;min-width:0}
  .pmenu{position:fixed;left:8px;right:8px;top:52px;width:auto}
  #mrBtn{padding:0 9px;font-size:11px}
  .steps{grid-row:4;position:static;margin:0;height:56px;width:100%;justify-content:space-around;border-top:1px solid var(--ink);background:var(--paper);overflow:visible;padding-bottom:env(safe-area-inset-bottom,0px)}
  .top .steps{display:none}
  .stepsM{display:flex}
  .step{flex:1;flex-direction:column;justify-content:center;gap:3px;padding:0 2px}
  .step .t{display:block;font-size:10.5px;letter-spacing:.02em}
  .step .n{width:20px;height:20px;font-size:10.5px}
  .step+.step::before{display:none}
  .step[aria-current="step"]::after{top:-1px;bottom:auto;left:18%;right:18%}
  .sub{height:auto;min-height:40px;padding:4px 10px;gap:8px}
  .subtabs{overflow-x:auto;max-width:100%;scrollbar-width:none}
  .subtabs::-webkit-scrollbar{display:none}
  .subtabs button{white-space:nowrap}
  .next{display:none}
  .drawer.open{position:fixed;inset:0;width:100vw;z-index:40}
  .sub:has(.subtabs:empty){display:none}   /* boʻlim ichida tanlov boʻlmasa — boʻsh qator yoʻq */
}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>
</head>
<body>

  <a class="brand" href="./" title="Bosh sahifa">

  <div class="pwrap"><input class="pname" id="pname" aria-label="Loyiha nomi" value="Yangi loyiha"><button class="pmenu-btn" id="pmBtn" aria-expanded="false" aria-label="Loyihalar roʻyxati">▾</button>
    <div class="pmenu" id="pmenu" hidden><div class="ph">Loyihalar · shu brauzerda</div><div id="plist"></div><div class="pf"><button class="btn dark" id="pNew">+ Yangi loyiha</button></div></div></div>

</header>

<script>
"use strict";
/* Qadamlar: har bir boʻlim — mavjud sahifa. Bir sahifa bitta iframe'da yashaydi va qadamlar orasida yopilmaydi,
   shuning uchun ish holati saqlanadi. Maʼlumot sahifalar orasida umumiy brauzer xotirasi orqali oʻtadi
   (kps_data — qatlamlar, kps_posadka — binolar, kps_mat — albom materiallari). */
const STEPS=[
  {id:"hudud", t:"Hudud", subs:[
    {id:"chegara", t:"Chegara va baho", page:"ai.html", hint:"Hududni doira, toʻrtburchak yoki erkin chegara bilan belgilang va «Hisoblash» ni bosing. 3D va ikonkalar shu yerda."},
    {id:"malumot", t:"Maʼlumot yuklash", page:"data.html", hint:"QGIS va boshqa dasturlardan GeoJSON, Shapefile, KML, CSV yuklang — qatlamlar Koʻcha studiyasi va albomda koʻrinadi."}]},
  {id:"tahlil", t:"Tahlil", subs:[
    {id:"tasnif", t:"Yer qoplami", page:"studio.html", app:"area", hint:"Sunʼiy yoʻldosh tasviridan asfalt, yashil va piyoda ulushi — hududni belgilab tahlil qiling."},
    {id:"gis", t:"Relyef · zichlik", page:"gis.html", hint:"Balandlik, nishablik, yer foydalanish va zichlik setkasi — 1-qadamdagi hudud ichida. Yuklangan GIS qatlamlar tahlilni boyitadi."},
    {id:"shamol", t:"Shamol", page:"shamol.html", hint:"Hudud markazini bosing va «Binolar va shamolni yuklash». Minoralarni 4-qadamdan oldin shu yerda sinab koʻrish mumkin."}]},
  {id:"kocha", t:"Koʻchalar", subs:[
    {id:"loyiha", t:"Loyiha chizish", page:"studio.html", app:"design", hint:"Koʻchalarni modullardan chizing; YHQ tekshiruvlari va 3D shu yerda."},
    {id:"profil", t:"Profil", page:"studio.html", app:"prof", hint:"Koʻchani bosing — mavjud koʻndalang kesim aniqlanadi; loyiha profili bilan solishtiring."}]},
  {id:"bino", t:"Binolar", subs:[
    {id:"posadka", t:"Joylashtirish", page:"posadka.html", hint:"Uchastkani chizing va binolarni qoʻying: qavatlar, zichlik, xonadonlar. Tayyor boʻlsa «Albomga →»."}]},
  {id:"albom", t:"Albom", subs:[
    {id:"maket", t:"Varaqlar", page:"maket.html", hint:"Oldingi qadamlarda «Albomga» bilan yuborilgan xaritalar va kesimlar shu yerda varaqlarga teriladi."}]}
];
const BUILD="28";   // boʻlim sahifalari brauzer keshidan eski nusxada ochilmasligi uchun; har chiqarishda oshiriladi
const PAGE_TO = {}; STEPS.forEach((s,i)=>s.subs.forEach((u,j)=>{ const k=u.page+(u.app?"#"+u.app:""); if(!PAGE_TO[k]) PAGE_TO[k]=[i,j]; if(!PAGE_TO[u.page]) PAGE_TO[u.page]=[i,j]; }));
const $=id=>document.getElementById(id);

/* --- loyiha holati (nom, joriy qadam, koʻrilgan qadamlar) --- */
let P={name:"Yangi loyiha", step:0, sub:{}, seen:[0]};
try{ const v=JSON.parse(localStorage.getItem("kps_project")||"null"); if(v&&typeof v==="object") P=Object.assign(P,v); }catch(e){}
const saveP=()=>{ try{ localStorage.setItem("kps_project",JSON.stringify(P)); }catch(e){} };
$("pname").value=P.name;
$("pname").addEventListener("input",e=>{ P.name=e.target.value.trim()||"Yangi loyiha"; saveP(); document.title=P.name+" — Archemistry Lab"; });
document.title=P.name+" — Archemistry Lab";

/* --- iframe'lar: har sahifa uchun bittadan, kerak boʻlganda yaratiladi --- */
const frames={};
function frameFor(page, src){
  let f=frames[page];
  if(!f){
    f=document.createElement("iframe"); f.title=page; f.hidden=true; f.dataset.page=page;
    f.addEventListener("load",()=>onFrameLoad(f));
    $("frames").appendChild(f); frames[page]=f;
    $("loading").hidden=false; f.src=src||(page+"?b="+BUILD);
  } else if(src){ $("loading").hidden=false; f.src=src; }
  return f;
}
function onFrameLoad(f){
  $("loading").hidden=true;
  let path=""; try{ path=f.contentWindow.location.pathname.split("/").pop()||"index.html"; }catch(e){ return; }
  if(path!==f.dataset.page){
    // sahifa skript orqali boshqa boʻlimga oʻtdi (masalan «Albomga →»): uni oʻz qadamida ochamiz, bu oynani qaytaramiz
    let full=path; try{ full=path+f.contentWindow.location.search+f.contentWindow.location.hash; }catch(e){}
    try{ f.contentWindow.history.back(); }catch(e){ f.src=f.dataset.page; }
    if(path==="index.html"||!PAGE_TO[path]) return;   // bosh sahifa yoki notanish sahifa: oyna oʻz boʻlimiga qaytariladi, loyiha yopilmaydi
    go(full);
    return;
  }
  if(f.dataset.wantApp) applyApp(f);
}
function applyApp(f){
  const app=f.dataset.wantApp; if(!app) return;
  try{ const b=f.contentDocument.querySelector('#appTabs button[data-app="'+app+'"]'); if(b){ b.click(); delete f.dataset.wantApp; } }catch(e){}
}

/* --- qadamni koʻrsatish --- */
function show(i, j, src){
  i=Math.max(0,Math.min(STEPS.length-1,i)); const st=STEPS[i];
  if(j==null) j=P.sub[st.id]||0; j=Math.max(0,Math.min(st.subs.length-1,j));
  const u=st.subs[j];
  P.step=i; P.sub[st.id]=j; if(!P.seen.includes(i)) P.seen.push(i); saveP(); { const c=REG.list&&REG.list.find(x=>x.id===REG.active); if(c){ c.t=new Date().toISOString(); c.step=i; localStorage.setItem("kps_projects",JSON.stringify(REG)); } }
  const f=frameFor(u.page, src);
  Object.values(frames).forEach(x=>x.hidden = x!==f);
  try{ f.contentWindow.dispatchEvent(new Event("resize")); }catch(e){}   // yashirin turgan xaritalar oʻlchamini qayta oladi
  if(u.app){ f.dataset.wantApp=u.app; applyApp(f); }
  renderNav();
  try{ history.replaceState(null,"","#"+st.id+"-"+u.id); }catch(e){}
}
function go(href){
  const page=href.split(/[?#]/)[0], hash=(href.split("#")[1]||"");
  if(page==="masterreja.html"){ openDrawer(true); return; }
  const key = PAGE_TO[page+"#"+hash] ? page+"#"+hash : page;
  const hit=PAGE_TO[key]; if(!hit) { location.href=href; return; }
  const sameStudio = page==="studio.html" && frames[page];
  show(hit[0], hit[1], (href.includes("?")||(!sameStudio&&href!==page)) ? href : undefined);
}
window.addEventListener("message",e=>{ if(e.origin!==location.origin||!e.data||e.data.kps!=="go") return; go(String(e.data.href)); });

function renderNav(){
  const i=P.step, st=STEPS[i], j=P.sub[st.id]||0;
  $("stepsM").innerHTML=$("steps").innerHTML=STEPS.map((s,k)=>`<button class="step${P.seen.includes(k)&&k!==i?" seen":""}" data-i="${k}" ${k===i?'aria-current="step"':""}><span class="n">${k+1}</span><span class="t">${s.t}</span></button>`).join("");
  $("subtabs").innerHTML = st.subs.length>1 ? st.subs.map((u,k)=>`<button data-j="${k}" aria-pressed="${k===j}">${u.t}</button>`).join("") : "";
  $("hint").textContent=st.subs[j].hint;
  const nx=STEPS[i+1]; $("nextBtn").textContent = nx ? `Keyingi: ${nx.t} →` : "Bosh sahifa";
}
$("steps").onclick=e=>{ const b=e.target.closest("button[data-i]"); if(b) show(+b.dataset.i); };
$("stepsM").onclick=$("steps").onclick;
$("subtabs").onclick=e=>{ const b=e.target.closest("button[data-j]"); if(b) show(P.step, +b.dataset.j); };
$("nextBtn").onclick=()=>{ if(P.step<STEPS.length-1) show(P.step+1); else location.href="./"; };

/* --- Master reja paneli: istalgan qadamda ochiladi --- */
let mrFrame=null;
function openDrawer(on){
  $("drawer").classList.toggle("open",on); $("mrBtn").setAttribute("aria-pressed",on);
  if(on && !mrFrame){ mrFrame=document.createElement("iframe"); mrFrame.title="Master reja"; mrFrame.src="masterreja.html?b="+BUILD; $("mrHost").appendChild(mrFrame); $("mrHost").style.height="100%"; }
  else if(on && mrFrame){ try{ mrFrame.contentWindow.location.reload(); }catch(e){} }   // yangi binolar va hudud koʻrsatkichlarini qayta oʻqish
}
$("mrBtn").onclick=()=>openDrawer(!$("drawer").classList.contains("open"));
$("mrClose").onclick=()=>openDrawer(false);

/* --- bir nechta loyiha ---
   Boʻlimlar oʻz maʼlumotini umumiy brauzer kalitlariga yozadi. Faol loyiha — shu kalitlardagi holat.
   Loyiha almashtirilganda joriy holat «kps_projects» bazasiga nusxalanadi, tanlangan loyiha holati qaytariladi.
   Sozlamalar (til, AI kaliti, palitralar), saqlangan tahlillar kutubxonasi va 3D aktivlar umumiy qoladi. */
const LS_KEYS=['kps_project','kps_v1','kps_saves','kps_posadka','kps_posadka_sum','kps_area_sum','kps_ai_sites','kps_official','kps_mrp','kps_mrp_ext','kps_site','kps_site_seen_studio'];
// albom, albom materiallari, yuklangan qatlamlar, saqlangan tahlillar va foydalanuvchi 3D modellari — hammasi loyihaga tegishli
const IDB_ALL=[['kps_maket','docs'],['kps_mat','mats'],['kps_data','layers'],['kps_ai_runs','runs'],['kps_assets','a']];
const IDB_ONE=[];
const IDB_OPT={kps_assets:{keyPath:'id',autoIncrement:true}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function idbOpen(name,store){return new Promise((res,rej)=>{const r=indexedDB.open(name,1);r.onupgradeneeded=()=>r.result.createObjectStore(store,IDB_OPT[name]||{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbTx(name,store,mode,fn){const db=await idbOpen(name,store);try{if(!db.objectStoreNames.contains(store))return mode==='readonly'?[]:null;
  return await new Promise((res,rej)=>{const t=db.transaction(store,mode),os=t.objectStore(store);let out;const r=fn(os);if(r)r.onsuccess=()=>{out=r.result;};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}finally{db.close();}}
const idbAll=(n,s)=>idbTx(n,s,'readonly',os=>os.getAll()).then(r=>r||[]);
const idbGet=(n,s,id)=>idbTx(n,s,'readonly',os=>os.get(id));
const idbReplace=(n,s,recs)=>idbTx(n,s,'readwrite',os=>{os.clear();(recs||[]).forEach(r=>os.put(r));});
const idbPut=(n,s,rec)=>idbTx(n,s,'readwrite',os=>rec?os.put(rec):null);
const idbDel=(n,s,id)=>idbTx(n,s,'readwrite',os=>os.delete(id));
let REG={active:null,list:[]};
try{const v=JSON.parse(localStorage.getItem('kps_projects')||'null');if(v&&Array.isArray(v.list))REG=v;}catch(e){}
const saveReg=()=>{try{localStorage.setItem('kps_projects',JSON.stringify(REG));}catch(e){}};
const newId=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
if(!REG.active||!REG.list.find(x=>x.id===REG.active)){ const id=newId(); REG.list.push({id,name:P.name,t:new Date().toISOString()}); REG.active=id; saveReg(); }
const cur=()=>REG.list.find(x=>x.id===REG.active);

async function snapshot(id){
  const snap={id,t:new Date().toISOString(),ls:{},idb:{}};
  LS_KEYS.forEach(k=>{const v=localStorage.getItem(k);if(v!=null)snap.ls[k]=v;});
  for(const [n,s] of IDB_ALL) snap.idb[n+'/'+s]=await idbAll(n,s);
  for(const [n,s,key] of IDB_ONE){const r=await idbGet(n,s,key);if(r)snap.idb[n+'/'+s+'#'+key]=r;}
  await idbPut('kps_projects','snap',snap);
}
async function clearLive(){
  LS_KEYS.forEach(k=>{try{localStorage.removeItem(k);}catch(e){}});
  for(const [n,s] of IDB_ALL) await idbReplace(n,s,[]);
  for(const [n,s,key] of IDB_ONE) await idbDel(n,s,key);
}
async function restore(id){
  const snap=await idbGet('kps_projects','snap',id); if(!snap) return;
  Object.entries(snap.ls||{}).forEach(([k,v])=>{try{localStorage.setItem(k,v);}catch(e){}});
  for(const [n,s] of IDB_ALL) await idbReplace(n,s,(snap.idb||{})[n+'/'+s]||[]);
  for(const [n,s,key] of IDB_ONE){const r=(snap.idb||{})[n+'/'+s+'#'+key]; if(r) await idbPut(n,s,r);}
  const legacy=(snap.idb||{})['kps_ai_runs/runs#last']; if(legacy && !((snap.idb||{})['kps_ai_runs/runs']||[]).length) await idbPut('kps_ai_runs','runs',legacy);
}
function teardown(){
  Object.values(frames).forEach(f=>f.remove()); for(const k in frames) delete frames[k];
  if(mrFrame){mrFrame.remove();mrFrame=null;} openDrawer(false);
}
function loadP(){ P={name:cur().name, step:0, sub:{}, seen:[0]}; try{const v=JSON.parse(localStorage.getItem('kps_project')||'null');if(v)P=Object.assign(P,v);}catch(e){} P.name=cur().name; $("pname").value=P.name; document.title=P.name+" — Archemistry Lab"; saveP(); }
async function withCover(fn){ $("cover").hidden=false; closeMenu(); teardown(); await sleep(400);   // boʻlimlar kechiktirilgan saqlashlarini tugatsin
  try{ await fn(); }catch(e){ $("cover").textContent="Xato: "+(e.message||e); await sleep(2500); }
  $("cover").hidden=true; $("cover").textContent="Loyiha almashtirilmoqda…"; loadP(); show(P.step||0); }
async function switchTo(id){ if(id===REG.active||!REG.list.find(x=>x.id===id)) return;
  await withCover(async()=>{ await snapshot(REG.active); await clearLive(); await restore(id); REG.active=id; saveReg(); }); }
async function newProject(){
  await withCover(async()=>{ await snapshot(REG.active); await clearLive();
    const id=newId(), n=REG.list.length+1; REG.list.push({id,name:"Loyiha "+n,t:new Date().toISOString()}); REG.active=id; saveReg(); }); }
async function delProject(id){ if(id===REG.active) return; REG.list=REG.list.filter(x=>x.id!==id); saveReg(); try{await idbDel('kps_projects','snap',id);}catch(e){} renderMenu(); }

/* --- loyihalar menyusi --- */
let armed=null;
function renderMenu(){
  const fmt=t=>t?String(t).slice(0,16).replace('T',' '):'';
  $("plist").innerHTML=REG.list.slice().reverse().map(x=>`<div class="pi${x.id===REG.active?' on':''}"><button class="nm" data-open="${x.id}">${x.name.replace(/[<>&"]/g,'')}</button><span class="tm">${x.id===REG.active?'ochiq':fmt(x.t)}</span>${x.id===REG.active?'<span></span>':`<button class="del${armed===x.id?' sure':''}" data-del="${x.id}">${armed===x.id?'Ha, oʻchir':'Oʻchirish'}</button>`}</div>`).join("");
}
function closeMenu(){ $("pmenu").hidden=true; $("pmBtn").setAttribute("aria-expanded","false"); armed=null; }
$("pmBtn").onclick=e=>{ e.stopPropagation(); const open=$("pmenu").hidden; if(open){ renderMenu(); $("pmenu").hidden=false; $("pmBtn").setAttribute("aria-expanded","true"); } else closeMenu(); };
$("plist").onclick=e=>{ const o=e.target.closest("[data-open]"), d=e.target.closest("[data-del]");
  if(o){ switchTo(o.dataset.open); return; }
  if(d){ if(armed===d.dataset.del) delProject(d.dataset.del); else { armed=d.dataset.del; renderMenu(); } } };
$("pNew").onclick=()=>newProject();
document.addEventListener("click",e=>{ if(!$("pmenu").hidden && !e.target.closest(".pwrap")) closeMenu(); });
$("pname").addEventListener("input",()=>{ const c=cur(); if(c){ c.name=P.name; c.t=new Date().toISOString(); saveReg(); } });

/* --- boshlash: #qadam-boʻlim havolasi yoki oxirgi holat --- */
(async function(){
  const q=new URLSearchParams(location.search);
  if(q.get("new")||q.get("p")){ history.replaceState(null,"",location.pathname+location.hash);
    if(q.get("new")){ await newProject(); return; }
    if(q.get("p")&&q.get("p")!==REG.active){ await switchTo(q.get("p")); return; } }
  const h=location.hash.slice(1).split("-"); const i=STEPS.findIndex(s=>s.id===h[0]);
  if(i>=0){ const j=STEPS[i].subs.findIndex(u=>u.id===h[1]); show(i, j>=0?j:0); } else show(P.step||0);
})();
</script>
